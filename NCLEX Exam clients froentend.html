                                    <span style={{ fontSize: 10, color: "#cbd5e1", marginLeft: "auto" }}>{q.nclexCategory}</span>
                                </div>

                                <div className="q-stem" style={{ fontSize: 15.5, fontWeight: 500, color: "#0f172a", lineHeight: 1.7, marginBottom: 20, letterSpacing: "-.01em" }}>
                                    {q.question}
                                </div>

                                {/* CLOZE / DROP-DOWN type — sentence with inline selects */}
                                {q.type === "cloze" ? (
                                    <div className="cloze-text">
                                        {(() => {
                                            // Split clozeText on {{N}} markers and interleave with <select> elements
                                            const parts = q.clozeText.split(/(\{\{\d+\}\})/g);
                                            return parts.map((part, pi) => {
                                                const m = part.match(/^\{\{(\d+)\}\}$/);
                                                if (!m) return <span key={pi}>{part}</span>;
                                                const blankIdx = parseInt(m[1], 10);
                                                const blank = q.clozeBlanks[blankIdx];
                                                if (!blank) return <span key={pi}>[blank {blankIdx} missing]</span>;
                                                const userPicks = Array.isArray(userAnswer) ? userAnswer
                                                    : (Array.isArray(selected) ? selected : []);
                                                const userPick = userPicks[blankIdx];
                                                const correctOpt = blank.correct;
                                                const isAnsweredNow = isAnswered;
                                                const isEmpty = userPick === undefined;
                                                const wasCorrect = isAnsweredNow && userPick === correctOpt;
                                                const wasWrong = isAnsweredNow && userPick !== correctOpt;
                                                let cls = "cloze-select";
                                                if (isEmpty) cls += " is-empty";
                                                if (wasCorrect) cls += " was-correct";
                                                if (wasWrong) cls += " was-wrong";
                                                return (
                                                    <span key={pi} className="cloze-blank">
                                                        <select
                                                            className={cls}
                                                            disabled={isAnsweredNow}
                                                            value={userPick === undefined ? "" : String(userPick)}
                                                            onChange={(e) => handleClozeSelect(blankIdx, parseInt(e.target.value, 10))}>
                                                            <option value="" disabled>Select…</option>
                                                            {blank.options.map((opt, oi) => (
                                                                <option key={oi} value={oi}>{opt}</option>
                                                            ))}
                                                        </select>
                                                        {wasWrong && (
                                                            <span className="cloze-correct-hint">✓ {blank.options[correctOpt]}</span>
                                                        )}
                                                    </span>
                                                );
                                            });
                                        })()}
                                    </div>
                                ) :
                                    /* MATRIX / GRID type — render a row × column table */
                                    q.type === "matrix" ? (
                                        <div className="matrix-wrap" style={{ marginBottom: 20 }}>
                                            <table className="matrix-table">
                                                <thead>
                                                    <tr>
                                                        <th className="row-head" style={{ width: "40%" }}> </th>
                                                        {q.matrixCols.map((col, ci) => <th key={ci}>{col}</th>)}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {q.matrixRows.map((row, ri) => {
                                                        const userPicks = Array.isArray(userAnswer) ? userAnswer
                                                            : (Array.isArray(selected) ? selected : []);
                                                        const userPickedCol = userPicks[ri];
                                                        const correctCol = q.correct[ri];
                                                        const rowAnswered = isAnswered;
                                                        const rowGotItRight = rowAnswered && userPickedCol === correctCol;
                                                        return (
                                                            <tr key={ri}>
                                                                <td className="matrix-row-label">
                                                                    <div style={{ display: "flex", alignItems: "center" }}>
                                                                        <span style={{ flex: 1 }}>{row}</span>
                                                                        {rowAnswered && (
                                                                            <span className="matrix-row-mark">
                                                                                {rowGotItRight ? (
                                                                                    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#16a34a" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10.5l4 4 8-9" /></svg>
                                                                                ) : (
                                                                                    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#FE5E7E" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 5l10 10M15 5L5 15" /></svg>
                                                                                )}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                                {q.matrixCols.map((col, ci) => {
                                                                    const isPicked = userPickedCol === ci;
                                                                    const wasCorrect = rowAnswered && isPicked && ci === correctCol;
                                                                    const wasWrong = rowAnswered && isPicked && ci !== correctCol;
                                                                    const wasCorrectUnpicked = rowAnswered && !isPicked && ci === correctCol;
                                                                    let cellCls = "matrix-cell";
                                                                    if (rowAnswered) cellCls += " disabled";
                                                                    if (!rowAnswered && isPicked) cellCls += " is-picked";
                                                                    if (wasCorrect) cellCls += " was-correct";
                                                                    if (wasWrong) cellCls += " was-wrong";
                                                                    if (wasCorrectUnpicked) cellCls += " was-correct-unpicked";
                                                                    return (
                                                                        <td key={ci}>
                                                                            <div className={cellCls} onClick={() => !rowAnswered && handleMatrixSelect(ri, ci)}>
                                                                                <div className="matrix-radio">
                                                                                    <div className="matrix-radio-inner" />
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                    );
                                                                })}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) :
                                        /* FILL-IN-THE-BLANK type — text or numeric input */
                                        q.type === "fill-blank" ? (
                                            <div style={{ marginBottom: 20 }}>
                                                {(() => {
                                                    const cfg = q.blankInput || {};
                                                    const isAnsweredNow = isAnswered;
                                                    const userVal = userAnswer !== undefined ? userAnswer : (selected !== null ? selected : "");
                                                    // Determine correctness for styling
                                                    let isUserCorrect = false;
                                                    if (isAnsweredNow) {
                                                        if (cfg.kind === "numeric") {
                                                            const u = parseFloat(userAnswer);
                                                            const c = parseFloat(cfg.correct);
                                                            const tol = cfg.tolerance != null ? parseFloat(cfg.tolerance) : 0;
                                                            isUserCorrect = !isNaN(u) && !isNaN(c) && Math.abs(u - c) <= tol;
                                                        } else {
                                                            const acceptable = Array.isArray(cfg.correct) ? cfg.correct : [cfg.correct];
                                                            const norm = (s) => cfg.caseSensitive ? String(s).trim() : String(s).trim().toLowerCase();
                                                            isUserCorrect = acceptable.some(a => norm(a) === norm(userAnswer));
                                                        }
                                                    }
                                                    const correctDisplay = Array.isArray(cfg.correct) ? cfg.correct[0] : cfg.correct;
                                                    const borderColor = isAnsweredNow ? (isUserCorrect ? "#16a34a" : "#FE5E7E") : "#cbd5e1";
                                                    const bgColor = isAnsweredNow ? (isUserCorrect ? "#ecfdf3" : "#fdecef") : "white";
                                                    return (
                                                        <div>
                                                            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", border: `1.5px solid ${borderColor}`, borderRadius: 10, background: bgColor, transition: "all .15s", maxWidth: 480 }}>
                                                                <input
                                                                    type={cfg.kind === "numeric" ? "number" : "text"}
                                                                    step={cfg.kind === "numeric" ? "any" : undefined}
                                                                    value={userVal}
                                                                    disabled={isAnsweredNow}
                                                                    placeholder={cfg.placeholder || (cfg.kind === "numeric" ? "Enter a number" : "Type your answer")}
                                                                    onChange={e => setSelected(e.target.value)}
                                                                    onKeyDown={e => {
                                                                        if (e.key === "Enter" && !isAnsweredNow && String(selected).trim().length > 0) {
                                                                            if (mode === "practice") {
                                                                                setRevealed(true);
                                                                                setAnswers(a => ({ ...a, [current]: selected }));
                                                                            }
                                                                        }
                                                                    }}
                                                                    style={{ flex: 1, minWidth: 0, border: "none", outline: "none", background: "transparent", fontFamily: "'DM Sans',sans-serif", fontSize: 15, fontWeight: 600, color: "#0f172a", padding: 0 }}
                                                                />
                                                                {cfg.unit && (
                                                                    <span style={{ fontSize: 13, fontWeight: 600, color: "#64748b", fontFamily: "'DM Mono',monospace", whiteSpace: "nowrap", borderLeft: "1px solid #e5e7eb", paddingLeft: 10 }}>
                                                                        {cfg.unit}
                                                                    </span>
                                                                )}
                                                                {isAnsweredNow && (
                                                                    <span style={{ flexShrink: 0 }}>
                                                                        {isUserCorrect ? (
                                                                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#16a34a" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10.5l4 4 8-9" /></svg>
                                                                        ) : (
                                                                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#FE5E7E" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 5l10 10M15 5L5 15" /></svg>
                                                                        )}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {isAnsweredNow && !isUserCorrect && (
                                                                <div style={{ marginTop: 8, fontSize: 12, color: "#16a34a", fontWeight: 600 }}>
                                                                    ✓ Correct answer: <span style={{ fontFamily: cfg.kind === "numeric" ? "'DM Mono',monospace" : "'DM Sans',sans-serif" }}>{correctDisplay}{cfg.unit ? ` ${cfg.unit}` : ""}</span>
                                                                </div>
                                                            )}
                                                            {!isAnsweredNow && (
                                                                <div style={{ marginTop: 6, fontSize: 11, color: "#94a3b8" }}>
                                                                    {cfg.kind === "numeric" ? "Enter a numeric value · press Enter or Submit when done" : "Type your answer · press Enter or Submit when done"}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        ) : (

                                            <div style={{ display: "flex", flexDirection: "column", gap: 1, marginBottom: 20 }}>
                                                {q.options.map((opt, i) => {
                                                    const userAnsArr = Array.isArray(userAnswer) ? userAnswer : (userAnswer !== undefined ? [userAnswer] : []);
                                                    const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
                                                    const selectedArr = Array.isArray(selected) ? selected : (selected !== null ? [selected] : []);
                                                    const isSelectedNow = selectedArr.includes(i);
                                                    const isAnsweredNow = isAnswered;
                                                    const isCorrectOpt = correctArr.includes(i);
                                                    const isUserPicked = isAnsweredNow && userAnsArr.includes(i);
                                                    const isUserWrong = isUserPicked && !isCorrectOpt;
                                                    const isMissedCorrect = isAnsweredNow && isCorrectOpt && !isUserPicked;

                                                    let cls = "opt";
                                                    if (!isAnsweredNow && isSelectedNow) cls += " selected";
                                                    else if (isAnsweredNow && isCorrectOpt) cls += " ans-correct";
                                                    else if (isUserWrong) cls += " ans-wrong";
                                                    else if (isAnsweredNow) cls += " ans-neutral";

                                                    return (
                                                        <button key={i} className={cls} onClick={() => handleSelect(i)} disabled={isAnsweredNow}>
                                                            <div className={`opt-control ${(q.multiSelect || q.type === "extended-multi") ? "checkbox" : "radio"}`}>
                                                                {(q.multiSelect || q.type === "extended-multi") ? (
                                                                    // Checkbox: white check inside when selected
                                                                    isSelectedNow || (isAnsweredNow && isUserPicked) ? (
                                                                        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="white" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                                                                            <path d="M2.5 6l2.5 2.5L9.5 3.5" />
                                                                        </svg>
                                                                    ) : null
                                                                ) : (
                                                                    // Radio: dot inside
                                                                    <div className="opt-control-inner" />
                                                                )}
                                                            </div>
                                                            <div className="opt-text">
                                                                <span>
                                                                    <span className="opt-letter-inline">{["A", "B", "C", "D", "E", "F"][i]}.</span>
                                                                    {" "}{opt.slice(3)}
                                                                </span>
                                                                {isAnsweredNow && isCorrectOpt && (
                                                                    <span className="opt-mark correct" aria-label="Correct">
                                                                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10.5l4 4 8-9" /></svg>
                                                                    </span>
                                                                )}
                                                                {isUserWrong && (
                                                                    <span className="opt-mark wrong" aria-label="Incorrect">
                                                                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 5l10 10M15 5L5 15" /></svg>
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        )}

                                {/* Stats block — shown after answering in Practice mode */}
                                {mode === "practice" && isAnswered && <QuestionStats question={q} />}

                                {/* Inline Submit button — only when user has selected but not yet submitted (multi-select needs explicit confirm) */}
                                {(() => {
                                    if (mode !== "practice" || isAnswered) return null;
                                    let canSubmit = false;
                                    let needsAll = false;
                                    let needLabel = "";
                                    if (q.type === "matrix") {
                                        const filled = Array.isArray(selected) ? selected.filter(v => v !== undefined).length : 0;
                                        canSubmit = filled === q.matrixRows.length;
                                        needsAll = !canSubmit && filled > 0;
                                        needLabel = `Answer all ${q.matrixRows.length} rows to submit`;
                                    } else if (q.type === "cloze") {
                                        const filled = Array.isArray(selected) ? selected.filter(v => v !== undefined).length : 0;
                                        canSubmit = filled === q.clozeBlanks.length;
                                        needsAll = !canSubmit && filled > 0;
                                        needLabel = `Fill in all ${q.clozeBlanks.length} blanks to submit`;
                                    } else if (q.type === "fill-blank") {
                                        canSubmit = typeof selected === "string" && selected.trim().length > 0;
                                    } else if (Array.isArray(selected) && selected.length > 0) {
                                        canSubmit = true;
                                    } else if (typeof selected === "number") {
                                        canSubmit = true;
                                    }
                                    if (!canSubmit && !needsAll) return null;
                                    return (
                                        <div style={{ display: "flex", justifyContent: "center", marginTop: 18, paddingTop: 18, borderTop: "1px solid #f1f5f9", gap: 12, alignItems: "center" }}>
                                            {needsAll && (
                                                <span style={{ fontSize: 12, color: "#d97706", fontWeight: 600 }}>
                                                    {needLabel}
                                                </span>
                                            )}
                                            {canSubmit && (
                                                <button style={{ background: "#2C5F8D", color: "#fff", border: "none", borderRadius: 9, padding: "11px 28px", fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 700, cursor: "pointer", transition: "all .15s", display: "inline-flex", alignItems: "center", gap: 6, letterSpacing: ".02em" }} onMouseEnter={e => { e.currentTarget.style.background = "#1e4773"; }} onMouseLeave={e => { e.currentTarget.style.background = "#2C5F8D"; }} onClick={() => { setRevealed(true); setAnswers(a => ({ ...a, [current]: selected })); }}>Submit Answer ✓</button>
                                            )}
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>

                        {/* RIGHT — Rationale panel (only shown after submit) */}
                        {revealed && (
                            <div className="rat-side-panel" style={{ width: 440, flexShrink: 0, display: "flex", flexDirection: "column", background: "white", overflow: "hidden", borderLeft: "1px solid #e2e8f0", animation: "slideInRight .25s ease" }}>
                                <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
                                    {/* Result banner */}
                                    {(() => {
                                        const credit = getCredit(q, userAnswer);
                                        const isPartial = !isCorrectAns && credit.points > 0;
                                        const bannerBg = isCorrectAns ? "#f0fdf4" : isPartial ? "#fffbeb" : "#fff5f5";
                                        const iconBg = isCorrectAns ? "#dcfce7" : isPartial ? "#fef3c7" : "#fee2e2";
                                        const titleColor = isCorrectAns ? "#166534" : isPartial ? "#92400e" : "#991b1b";
                                        const subColor = isCorrectAns ? "#16a34a" : isPartial ? "#d97706" : "#dc2626";
                                        const title = isCorrectAns ? "Correct!" : isPartial ? `Partial credit — ${credit.percent}%` : "Incorrect";
                                        const icon = isCorrectAns ? "✓" : isPartial ? "◐" : "✗";
                                        const correctLetters = (Array.isArray(q.correct) ? q.correct : [q.correct]).map(ci => ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"][ci]).join(", ");
                                        let sub;
                                        if (isCorrectAns) sub = "Well done — see the breakdown below";
                                        else if (isPartial) sub = `${credit.points} of ${credit.max} correct selections — see breakdown`;
                                        else if (q.type === "fill-blank") {
                                            const cfg = q.blankInput || {};
                                            const correctDisplay = Array.isArray(cfg.correct) ? cfg.correct[0] : cfg.correct;
                                            sub = `Correct answer: ${correctDisplay}${cfg.unit ? ` ${cfg.unit}` : ""}`;
                                        } else if (q.type === "matrix" || q.type === "cloze") {
                                            sub = "See the breakdown below";
                                        } else {
                                            sub = `Correct answer${Array.isArray(q.correct) ? "s" : ""}: ${correctLetters}`;
                                        }
                                        return (
                                            <div style={{ padding: "14px 20px", borderBottom: "1px solid #f1f5f9", flexShrink: 0, background: bannerBg }}>
                                                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                                    <div style={{ width: 34, height: 34, borderRadius: 10, background: iconBg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{icon}</div>
                                                    <div>
                                                        <div style={{ fontSize: 14, fontWeight: 700, color: titleColor }}>{title}</div>
                                                        <div style={{ fontSize: 11, color: subColor }}>{sub}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()}

                                    {/* New rationale block */}
                                    <div style={{ flex: 1, overflow: "auto", padding: "16px" }}>
                                        <RationaleBlock question={q} userAnswer={userAnswer} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Navigator */}
                        {showNav && (
                            <div style={{ width: 220, background: "white", borderLeft: "1px solid #e2e8f0", padding: "16px 12px", overflow: "auto", flexShrink: 0, animation: "slideInRight .2s ease" }}>
                                <div style={{ fontSize: 12, fontWeight: 700, color: "#0f172a", marginBottom: 12 }}>Navigator</div>
                                <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 5, marginBottom: 14 }}>
                                    {questions.map((_, i) => {
                                        const isAns = answers[i] !== undefined;
                                        const isCur = i === current;
                                        const isCorr = isAns && isAnswerScored(questions[i], answers[i]);
                                        const isFlag = flagged[i];
                                        return (
                                            <button key={i} onClick={() => setCurrent(i)}
                                                style={{ width: "100%", aspectRatio: "1", border: `2px solid ${isCur ? "#2C5F8D" : isAns ? (isCorr ? "#86efac" : "#fca5a5") : "#e2e8f0"}`, borderRadius: 8, background: isCur ? "#eef4fb" : isAns ? (isCorr ? "#f0fdf4" : "#fff5f5") : "white", cursor: "pointer", fontSize: 11, fontWeight: 700, color: isCur ? "#2C5F8D" : isAns ? (isCorr ? "#16a34a" : "#dc2626") : "#94a3b8", position: "relative", transition: "all .15s" }}>
                                                {i + 1}
                                                {isFlag && <div style={{ position: "absolute", top: 0, right: 0, width: 6, height: 6, borderRadius: "50%", background: "#f59e0b", transform: "translate(2px,-2px)" }} />}
                                            </button>
                                        );
                                    })}

        // ═══════════════════════════════════════════════════════
        // DONUT
        // ═══════════════════════════════════════════════════════
        function Donut({ size = 140, stroke = 14, value, color = "#16a34a", bg = "#f1f5f9", label, sublabel }) {
            const r = (size - stroke) / 2;
            const circ = 2 * Math.PI * r;
            const off = circ - (value / 100) * circ;
            return (
                <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
                    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
                        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={bg} strokeWidth={stroke} />
                        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
                            strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
                            style={{ transition: "stroke-dashoffset 1s ease" }} />
                    </svg>
                    <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                        {label && <div style={{ fontSize: 22, fontWeight: 800, color: "#1e293b", lineHeight: 1 }}>{label}</div>}
                        {sublabel && <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 2, fontWeight: 500 }}>{sublabel}</div>}
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════
        // CONFIGURE MODAL
        // ═══════════════════════════════════════════════════════
        function ConfigureModal({ category, subtopic, onClose, onStart, questionStats }) {
            const [mode, setMode] = useState("practice");
            const [count, setCount] = useState(10);
            const [filter, setFilter] = useState("unused");
            const title = subtopic ? subtopic : category.label;
            const sub = subtopic ? `${category.label} — subtopic` : `${category.count} questions available`;

            // Build counts for each filter, split by Classic vs NGN
            // questionStats prop = { unused: {classic, ngn}, incorrect: {...}, marked: {...}, all: {...} }
            // Defaults if not provided yet
            const stats = questionStats || {
                unused: { classic: category.count || 0, ngn: 0 },
                incorrect: { classic: 0, ngn: 0 },
                marked: { classic: 0, ngn: 0 },
                all: { classic: category.count || 0, ngn: 0 },
            };

            const filters = [
                { id: "unused", label: "Unused", desc: "Never attempted" },
                { id: "incorrect", label: "Incorrect", desc: "Got wrong before" },
                { id: "marked", label: "Marked", desc: "Flagged for review" },
                { id: "all", label: "All", desc: "Entire question pool" },
            ];

            return (
                <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="modal" style={{ width: 540, padding: 28, maxHeight: "90vh", overflowY: "auto" }}>
                        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 22, gap: 12 }}>
                            <div style={{ minWidth: 0, flex: 1 }}>
                                <div style={{ fontSize: 18, fontWeight: 800, color: "#0f172a", fontFamily: "'DM Sans',sans-serif", letterSpacing: "-.02em" }}>{title}</div>
                                <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 3 }}>{sub}</div>
                            </div>
                            <button className="btn-ghost" onClick={onClose} style={{ padding: "6px 10px", flexShrink: 0 }}>✕</button>
                        </div>

                        {/* QUESTION FILTER */}
                        <div style={{ marginBottom: 18 }}>
                            <div style={{ fontSize: 11, fontWeight: 700, color: "#64748b", letterSpacing: ".06em", textTransform: "uppercase", marginBottom: 10 }}>Question Filter</div>
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                {filters.map(f => {
                                    const isActive = filter === f.id;
                                    const fStats = stats[f.id] || { classic: 0, ngn: 0 };
                                    const total = fStats.classic + fStats.ngn;
                                    const isDisabled = total === 0;
                                    return (
                                        <button
                                            key={f.id}
                                            onClick={() => !isDisabled && setFilter(f.id)}
                                            disabled={isDisabled}
                                            style={{
                                                display: "flex", alignItems: "center", gap: 9, padding: "10px 12px",
                                                border: `1.5px solid ${isActive ? "#2C5F8D" : "#e2e8f0"}`,
                                                borderRadius: 8, background: isActive ? "#eef4fb" : "white",
                                                cursor: isDisabled ? "not-allowed" : "pointer", transition: "all .15s",
                                                opacity: isDisabled ? .5 : 1, textAlign: "left", fontFamily: "'DM Sans',sans-serif"
                                            }}>
                                            <div style={{ width: 16, height: 16, borderRadius: "50%", border: `1.5px solid ${isActive ? "#2C5F8D" : "#cbd5e1"}`, background: "white", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                                                {isActive && <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#2C5F8D" }} />}
                                            </div>
                                            <div style={{ minWidth: 0, flex: 1 }}>
                                                <div style={{ fontSize: 13, fontWeight: 700, color: isActive ? "#2C5F8D" : "#0f172a", lineHeight: 1.2 }}>{f.label}</div>
                                                <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 2, fontFamily: "'DM Mono',monospace" }}>
                                                    {fStats.classic} Classic{fStats.ngn > 0 ? ` + ${fStats.ngn} NGN` : ""}
                                                </div>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* MODE */}
                        <div style={{ marginBottom: 18 }}>
                            <div style={{ fontSize: 11, fontWeight: 700, color: "#64748b", letterSpacing: ".06em", textTransform: "uppercase", marginBottom: 10 }}>Mode</div>
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                {[{ id: "practice", label: "Tutorial Mode", desc: "Receive instant explanations after submitting your answers." }, { id: "test", label: "Test Mode", desc: "Answers and explanations are not shown until you complete your test." }].map(m => (
                                    <div key={m.id} onClick={() => setMode(m.id)}
                                        style={{ padding: "14px 16px", borderRadius: 8, border: `1.5px solid ${mode === m.id ? "#2C5F8D" : "#e2e8f0"}`, background: mode === m.id ? "#eef4fb" : "white", cursor: "pointer", transition: "all .15s" }}>
                                        <div style={{ fontSize: 13, fontWeight: 700, color: mode === m.id ? "#2C5F8D" : "#1e293b", marginBottom: 4 }}>{m.label}</div>
                                        <div style={{ fontSize: 11, color: "#94a3b8", lineHeight: 1.5 }}>{m.desc}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* QUESTIONS */}
                        <div style={{ marginBottom: 18 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                                <div style={{ fontSize: 11, fontWeight: 700, color: "#64748b", letterSpacing: ".06em", textTransform: "uppercase" }}>Questions</div>
                                <div style={{ fontSize: 14, fontWeight: 700, color: "#2C5F8D" }}>{count}</div>

                            Start Session →
                        </button>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════
        // PRACTICE BY CATEGORY
        // ═══════════════════════════════════════════════════════
        function PracticeByCategorySection({ onStartExam, computeStats, applyFilter }) {
            const [expanded, setExpanded] = useState({});
            const [expandedSec, setExpandedSec] = useState(
                Object.fromEntries(CURRICULUM.map(s => [s.id, true]))
            );
            const [configuring, setConfiguring] = useState(null);

            const toggle = id => setExpanded(e => ({ ...e, [id]: !e[id] }));
            const toggleSec = id => setExpandedSec(e => ({ ...e, [id]: !e[id] }));
            const launch = (cat, sub) => setConfiguring({ category: cat, subtopic: sub || null });

            // Map each category id to a clean stroke SVG icon
            const getCategoryIcon = (catId) => {
                const iconProps = { width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "1.8", strokeLinecap: "round", strokeLinejoin: "round" };
                switch (catId) {
                    case "fund-a": return <svg {...iconProps}><rect x="6" y="3" width="12" height="18" rx="1" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="9" y1="12" x2="15" y2="12" /><line x1="9" y1="16" x2="13" y2="16" /></svg>; // clipboard
                    case "fund-b": return <svg {...iconProps}><path d="M4 4v6a4 4 0 0 0 8 0V4" /><circle cx="18" cy="14" r="2" /><path d="M8 14a6 6 0 0 0 6 6 4 4 0 0 0 4-4" /></svg>; // stethoscope
                    case "pharm-a": return <svg {...iconProps}><path d="M9 3h6l-1 5h-4l-1-5z" /><path d="M9 8c-2 4-3 6-3 9a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4c0-3-1-5-3-9" /></svg>; // flask

                    case "peds": return <svg {...iconProps}><circle cx="12" cy="9" r="4" /><path d="M5 21c0-4 3-7 7-7s7 3 7 7" /></svg>; // child
                    case "mental": return <svg {...iconProps}><path d="M9 3a4 4 0 0 0-4 4v0a4 4 0 0 0-2 3.5A4 4 0 0 0 5 14v3a3 3 0 0 0 3 3h1V3z" /><path d="M15 3a4 4 0 0 1 4 4v0a4 4 0 0 1 2 3.5A4 4 0 0 1 19 14v3a3 3 0 0 1-3 3h-1V3z" /></svg>; // brain
                    case "geron": return <svg {...iconProps}><circle cx="12" cy="6" r="3" /><path d="M9 21v-7l-2-3 5-2 5 2-2 3v7" /></svg>; // person
                    case "icu": return <svg {...iconProps}><polyline points="3 12 7 12 9 7 12 17 14 12 21 12" /></svg>; // heartbeat line
                    case "er": return <svg {...iconProps}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>; // bolt
                    case "community": return <svg {...iconProps}><path d="M3 21V10l9-7 9 7v11" /><path d="M9 21v-6h6v6" /></svg>; // home
                    case "pubhealth": return <svg {...iconProps}><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>; // globe
                    case "leadership": return <svg {...iconProps}><circle cx="12" cy="8" r="4" /><polyline points="9 13 7 22 12 19 17 22 15 13" /></svg>; // medal
                    case "mgmt": return <svg {...iconProps}><line x1="6" y1="20" x2="6" y2="13" /><line x1="12" y1="20" x2="12" y2="8" /><line x1="18" y1="20" x2="18" y2="4" /></svg>; // bar chart
                    case "research": return <svg {...iconProps}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.5" y2="16.5" /></svg>; // search/magnify
                    case "informatics": return <svg {...iconProps}><rect x="3" y="4" width="18" height="13" rx="1.5" /><line x1="8" y1="21" x2="16" y2="21" /><line x1="12" y1="17" x2="12" y2="21" /></svg>; // monitor
                    case "ethics": return <svg {...iconProps}><line x1="12" y1="3" x2="12" y2="21" /><path d="M5 7l7-2 7 2" /><path d="M5 7l-2 7a4 4 0 0 0 4 0z" /><path d="M19 7l2 7a4 4 0 0 1-4 0z" /><line x1="8" y1="21" x2="16" y2="21" /></svg>; // scales
                    default: return <svg {...iconProps}><rect x="4" y="4" width="16" height="16" rx="1.5" /></svg>;

            return (
                <div style={{ flex: 1, overflow: "auto", padding: "24px 28px", background: "#f4f6f9" }}>

                                    <span style={{ fontSize: 12, color: "#94a3b8", fontWeight: 500 }}>

                                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                                        {sec.categories.map(cat => {
                                            const isOpen = expanded[cat.id];
                                            const catTotal = cat.subtopics.reduce((a, s) => a + s.count, 0);

                                            const secColor = "#2C5F8D";
                                            const secBg = "#eef4fb";
                                            return (
                                                <div key={cat.id} style={{ background: "white", border: "1px solid #e2e8f0", borderRadius: 6, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,.04)" }}>

                                                    <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 18px" }}>
                                                        <div style={{ width: 38, height: 38, borderRadius: 6, background: secBg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, border: `1px solid ${secColor}22`, color: secColor }}>

                                                        <div style={{ flex: 1, minWidth: 0 }}>

                                                            <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 1 }}>

                                                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, borderTop: `1px solid ${secColor}18` }}>
                                                        <button
                                                            onClick={() => launch(cat, null)}
                                                            style={{
                                                                display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "11px 14px",
                                                                border: "none", borderRight: `1px solid ${secColor}18`,
                                                                background: secBg, cursor: "pointer",
                                                                fontFamily: "'DM Sans',sans-serif", transition: "all .15s"

                                                            </div>
                                                        </button>

                                                        <button

                                                            style={{
                                                                display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "11px 14px",

                                                                background: isOpen ? secColor + "15" : "white", cursor: "pointer",
                                                                fontFamily: "'DM Sans',sans-serif", transition: "all .15s"

                                                            onMouseEnter={e => { if (!isOpen) e.currentTarget.style.background = "#f8fafc"; }}
                                                            onMouseLeave={e => { if (!isOpen) e.currentTarget.style.background = "white"; }}>

                                                                <div style={{ fontSize: 12, fontWeight: 700, color: isOpen ? secColor : "#475569" }}>Practice by Subtopic</div>
                                                                <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 1 }}>{cat.subtopics.length} topics to choose from</div>
                                                            </div>
                                                            <span style={{ marginLeft: "auto", fontSize: 10, fontWeight: 700, color: isOpen ? secColor : "#94a3b8", transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .2s", display: "inline-block" }}>▾</span>

                                                                    <div style={{ textAlign: "right" }}>

                                                                            onMouseEnter={e => { e.currentTarget.style.background = secColor; e.currentTarget.style.color = "white"; }}
                                                                            onMouseLeave={e => { e.currentTarget.style.background = secBg; e.currentTarget.style.color = secColor; }}
                                                                            onClick={e => { e.stopPropagation(); launch(cat, sub); }}>
                                                                            Practice →
                                                                        </button>
                                                                    </div>
                                                                </div>

                    {configuring && (

                                // Tutorial QBank: only traditional question types (multiple choice, SATA, fill-in-the-blank)
                                // Excludes NGN partial-credit types (extended-multi, matrix, cloze, bowtie, highlight, rank, trend)
                                const NGN_TYPES = new Set(["extended-multi", "matrix", "cloze", "bowtie", "highlight", "rank", "trend"]);
                                const traditionalPool = SAMPLE_QUESTIONS.filter(q => !NGN_TYPES.has(q.type));
                                return computeStats ? computeStats(traditionalPool) : null;
                            })()}
                            onClose={() => setConfiguring(null)}
                            onStart={cfg => {
                                const subName = configuring.subtopic ? configuring.subtopic.name : null;
                                const label = subName ? `${configuring.category.label} — ${subName}` : configuring.category.label;
                                // Tutorial QBank: only traditional types
                                const NGN_TYPES = new Set(["extended-multi", "matrix", "cloze", "bowtie", "highlight", "rank", "trend"]);
                                const traditionalPool = SAMPLE_QUESTIONS.filter(q => !NGN_TYPES.has(q.type));
                                // Apply the question filter; fall back to full traditional pool if filter empties everything
                                const pool = applyFilter ? applyFilter(traditionalPool, cfg.filter) : traditionalPool;
                                const finalPool = pool.length > 0 ? pool : traditionalPool;
                                setConfiguring(null);
                                onStartExam(finalPool, cfg.mode, label);
                            }}
                        />

        // FULL NCLEX
        // ═══════════════════════════════════════════════════════
        function FullNCLEXSection({ onStartExam, consumedExams }) {
            return (
                <div style={{ flex: 1, overflow: "auto", padding: "28px 32px" }}>
                    <div style={{ maxWidth: 720, margin: "0 auto" }}>
                        <div style={{ marginBottom: 24 }}>
                            <h2 style={{ fontSize: 22, fontWeight: 800, color: "#0f172a", fontFamily: "'DM Sans',sans-serif", letterSpacing: "-.02em", marginBottom: 6 }}>Next-Gen NCLEX RN Simulator</h2>
                            <p style={{ fontSize: 14, color: "#64748b" }}>85-question simulated NCLEX exams under timed conditions (2h 30min). <strong>Each exam can be taken only once</strong> — after you finish and review your answers, the exam is permanently locked.</p>
                        </div>

                        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                            {FULL_EXAMS.map((exam, i) => {
                                const isConsumed = !!(consumedExams && consumedExams[exam.id]);
                                const locked = exam.status === "locked" || isConsumed;
                                const completed = exam.status === "completed" && !isConsumed;
                                const available = exam.status === "available" && !isConsumed;
                                return (
                                    <div key={exam.id} className="card" style={{ opacity: (exam.status === "locked") ? 0.6 : 1, animation: `fadeUp .3s ease ${i * .06}s both` }}>
                                        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                                            <div style={{
                                                width: 48, height: 48, borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0,
                                                background: isConsumed ? "#f1f5f9" : completed ? "#dcfce7" : available ? "#dbeafe" : "#f1f5f9"
                                            }}>
                                                {isConsumed ? "🔒" : completed ? "✓" : available ? "▶" : "🔒"}
                                            </div>
                                            <div style={{ flex: 1 }}>
                                                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                                                    <div style={{ fontSize: 15, fontWeight: 700, color: "#1e293b" }}>{exam.title}</div>
                                                    {!isConsumed && exam.tag && <span style={{ padding: "2px 8px", borderRadius: 99, background: "#fef3c7", color: "#92400e", fontSize: 10, fontWeight: 700 }}>{exam.tag}</span>}
                                                    {isConsumed && <span style={{ padding: "2px 8px", borderRadius: 99, background: "#fee2e2", color: "#991b1b", fontSize: 10, fontWeight: 700 }}>Locked</span>}
                                                </div>
                                                <div style={{ fontSize: 12, color: "#94a3b8" }}>{exam.subtitle} · {exam.questions} questions · {exam.minutes} min · {exam.difficulty}</div>
                                                {completed && <div style={{ fontSize: 12, color: "#64748b", marginTop: 3 }}>Completed {exam.completedDate}</div>}
                                                {isConsumed && <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 3 }}>You've already completed and reviewed this exam.</div>}
                                            </div>
                                            {isConsumed ? (
                                                <span style={{ fontSize: 12, color: "#94a3b8" }}>Locked</span>
                                            ) : completed ? (
                                                <div style={{ textAlign: "center", flexShrink: 0 }}>
                                                    <div style={{ fontSize: 22, fontWeight: 800, color: scoreColor(exam.score) }}>{exam.score}%</div>
                                                    <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 1 }}>Score</div>
                                                </div>
                                            ) : available ? (
                                                <button className="btn-primary" onClick={() => onStartExam(SAMPLE_QUESTIONS, "test", exam.title, { examId: exam.id, isFullExam: true })}>Start Exam →</button>
                                            ) : (
                                                <span style={{ fontSize: 12, color: "#94a3b8" }}>Locked</span>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

                                    <div style={{ position: "relative", width: 140, height: 140, flexShrink: 0 }}>
                                        <svg width={140} height={140} style={{ transform: "rotate(-90deg)" }}>
                                            <circle cx={70} cy={70} r={56} fill="none" stroke="#fee2e2" strokeWidth={14} />
                                            <circle cx={70} cy={70} r={56} fill="none" stroke="#16a34a" strokeWidth={14}
                                                strokeDasharray={2 * Math.PI * 56} strokeDashoffset={2 * Math.PI * 56 * (1 - 0.69)} strokeLinecap="round"
                                                style={{ transition: "stroke-dashoffset 1s ease" }} />
                                        </svg>
                                        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                                            <div style={{ fontSize: 22, fontWeight: 800, color: "#1e293b" }}>69%</div>
                                            <div style={{ fontSize: 11, color: "#94a3b8", fontWeight: 500 }}>Correct</div>
                                        </div>
                                    </div>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                                            <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#16a34a", flexShrink: 0 }} />
                                            <div>
                                                <div style={{ fontSize: 18, fontWeight: 800, color: "#16a34a" }}>485</div>
                                                <div style={{ fontSize: 12, color: "#64748b" }}>Correct (69%)</div>
                                            </div>
                                        </div>
                                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                            <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#f87171", flexShrink: 0 }} />
                                            <div>
                                                <div style={{ fontSize: 18, fontWeight: 800, color: "#dc2626" }}>215</div>
                                                <div style={{ fontSize: 12, color: "#64748b" }}>Incorrect (31%)</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 10 }}>This week's activity</div>
                                    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 52 }}>
                                        {weekDays.map((day, i) => (
                                            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                                                <div style={{
                                                    width: "100%", borderRadius: 4, background: weekActivity[i] > 0 ? "rgba(44,95,141,0.3)" : "#f1f5f9",
                                                    height: `${maxAct > 0 ? (weekActivity[i] / maxAct) * 38 + 4 : 4}px`, transition: "height .6s ease", minHeight: 4
                                                }} />
                                                <div style={{ fontSize: 10, color: "#94a3b8", fontWeight: 500 }}>{day}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style={{ background: "white", borderRadius: 14, border: "1px solid #e2e8f0", overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.04)" }}>
                            <div style={{ padding: "18px 24px", borderBottom: "1px solid #f1f5f9", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                                <div style={{ fontSize: 15, fontWeight: 700, color: "#0f172a" }}>Performance by Category</div>
                                <div style={{ fontSize: 12, color: "#94a3b8" }}>Your scores across different NCLEX categories</div>
                            </div>
                            <div style={{ padding: "8px 0" }}>
                                {PERF_DATA.map((cat, i) => {
                                    const ahead = cat.delta >= 0;
                                    return (
                                        <div key={cat.name} style={{ padding: "14px 24px", borderBottom: i < PERF_DATA.length - 1 ? "1px solid #f8fafc" : "none" }}>
                                            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                                                <div style={{ fontSize: 14, fontWeight: 700, color: "#1e293b", minWidth: 140 }}>{cat.name}</div>
                                                <span style={{
                                                    padding: "2px 9px", borderRadius: 99, fontSize: 11, fontWeight: 700,
                                                    background: ahead ? "#dcfce7" : "#fee2e2", color: ahead ? "#166534" : "#991b1b", flexShrink: 0
                                                }}>
                                                    {ahead ? "+" : ""}{cat.delta}% vs peers
                                                </span>
                                                <div style={{ flex: 1 }} />
                                                <div style={{ fontSize: 12, color: "#64748b", flexShrink: 0 }}>{cat.questions} questions</div>
                                                <div style={{ fontSize: 16, fontWeight: 800, color: scoreColor(cat.score), width: 42, textAlign: "right", flexShrink: 0 }}>{cat.score}%</div>
                                            </div>
                                            <div style={{ height: 7, background: "#f1f5f9", borderRadius: 99, overflow: "hidden", position: "relative", marginBottom: 5 }}>
                                                <div style={{ height: "100%", borderRadius: 99, background: scoreColor(cat.score), width: `${cat.score}%`, transition: "width 1s ease" }} />
                                                <div style={{ position: "absolute", top: 0, height: "100%", width: 2, background: "rgba(0,0,0,.18)", left: `${cat.peer}%`, borderRadius: 1 }} />
                                            </div>
                                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#94a3b8" }}>
                                                <span>Your score: {cat.score}%</span>
                                                <span>Peer average: {cat.peer}%</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════
        // APP
        // ═══════════════════════════════════════════════════════
        function App() {
            const [section, setSection] = useState("practice-category");
            const [examState, setExamState] = useState(null);

            // Per-question history (session-only) — used to compute Question Filter counts in Practice modal
            // Each value is one of: "incorrect" | "correct" | undefined (untouched)
            const [qHistory, setQHistory] = useState({}); // { qid: "incorrect" | "correct" }
            const [qMarked, setQMarked] = useState({}); // { qid: true }

            // Consumed exam IDs — once finished + reviewed, the 5 NCLEX exams cannot be retaken
            const [consumedExams, setConsumedExams] = useState({}); // { examId: true }

            const nav = [
                { id: "practice-category", label: "Tutorial QBank" },
                { id: "full-nclex", label: "Next-Gen NCLEX RN" },
                { id: "progress", label: "Progress" },
            ];

            // Compute question stats for the modal filter (Practice/By Category only)
            // Returns: { unused: {classic, ngn}, incorrect: {...}, marked: {...}, all: {...} }
            const NGN_TYPES = new Set(["extended-multi", "matrix", "cloze", "bowtie", "trend", "highlight", "rank"]);
            const isNgn = (q) => NGN_TYPES.has(q.type) || q.multiSelect === true;
            const computeStats = (questions) => {
                const buckets = {
                    unused: { classic: 0, ngn: 0 },
                    incorrect: { classic: 0, ngn: 0 },
                    marked: { classic: 0, ngn: 0 },
                    all: { classic: 0, ngn: 0 },
                };
                questions.forEach(q => {
                    const ngn = isNgn(q);
                    const key = ngn ? "ngn" : "classic";
                    buckets.all[key]++;
                    if (qHistory[q.id] === "incorrect") buckets.incorrect[key]++;
                    if (qMarked[q.id]) buckets.marked[key]++;
                    if (!qHistory[q.id]) buckets.unused[key]++;
                });
                return buckets;
            };

            // Apply the chosen filter to a question pool
            const applyFilter = (questions, filter) => {
                switch (filter) {
                    case "incorrect": return questions.filter(q => qHistory[q.id] === "incorrect");
                    case "marked": return questions.filter(q => qMarked[q.id]);
                    case "unused": return questions.filter(q => !qHistory[q.id]);
                    case "all":
                    default: return questions;
                }
            };

            const handleStartExam = (questions, mode, title, opts = {}) => {
                setExamState({ questions, mode, title, ...opts });
            };

            // Called when QuestionInterface finishes — receives session results to update history + consumed
            const handleExamFinish = ({ answers, flagged, isAnswerScored, examId, isFullExam }) => {
                // Update qHistory: mark each answered Q as correct/incorrect
                const newHistory = { ...qHistory };
                Object.entries(answers).forEach(([idx, ans]) => {
                    const q = examState.questions[+idx];
                    if (!q) return;
                    const ok = isAnswerScored(q, ans);
                    // Don't downgrade a previously-correct answer to incorrect on re-attempt
                    if (ok) newHistory[q.id] = "correct";
                    else if (newHistory[q.id] !== "correct") newHistory[q.id] = "incorrect";
                });
                setQHistory(newHistory);

                // Update marked
                const newMarked = { ...qMarked };
                Object.entries(flagged).forEach(([idx, isFlagged]) => {
                    const q = examState.questions[+idx];
                    if (!q) return;
                    if (isFlagged) newMarked[q.id] = true;
                });
                setQMarked(newMarked);

                // If this was one of the 5 Full NCLEX exams, mark it consumed (locked after review)
                if (isFullExam && examId != null) {
                    setConsumedExams(prev => ({ ...prev, [examId]: true }));
                }
            };

            if (examState) {
                return (
                    <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#f4f6f9" }}>
                        <QuestionInterface
                            questions={examState.questions}
                            mode={examState.mode}
                            title={examState.title}
                            examMeta={{ examId: examState.examId, isFullExam: !!examState.isFullExam }}
                            onSessionEnd={handleExamFinish}
                            onFinish={() => setExamState(null)}
                        />
                    </div>
                );
            }

            return (
                <div style={{ height: "100vh", display: "flex", background: "#f4f6f9" }}>

                    <div style={{ width: 230, background: "white", borderRight: "1px solid #e2e8f0", display: "flex", flexDirection: "column", flexShrink: 0 }}>
                        <div style={{ padding: "22px 20px 16px", borderBottom: "1px solid #f1f5f9" }}>
                            <div style={{ fontSize: 20, fontWeight: 800, color: "#0f172a", fontFamily: "'DM Sans',sans-serif", letterSpacing: "-.02em", lineHeight: 1.1 }}>
                                NCLEX Exams
                            </div>
                            <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 4, fontWeight: 500 }}>Master NCLEX Practice</div>
                        </div>

                        <nav style={{ flex: 1, padding: "14px 12px", overflow: "auto" }}>
                            {nav.map(item => {
                                const isActive = section === item.id;
                                // SVG icon per nav id
                                let iconSvg;
                                if (item.id === "practice-category") {
                                    // Stack/layers icon
                                    iconSvg = (
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <polygon points="12 2 2 7 12 12 22 7 12 2" />
                                            <polyline points="2 17 12 22 22 17" />
                                            <polyline points="2 12 12 17 22 12" />
                                        </svg>
                                    );
                                } else if (item.id === "full-nclex") {
                                    // Clipboard with check
                                    iconSvg = (
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <rect x="5" y="4" width="14" height="17" rx="2" />
                                            <path d="M9 4V2h6v2" />
                                            <polyline points="9 13 11 15 15 11" />
                                        </svg>
                                    );
                                } else {
                                    // Bar chart
                                    iconSvg = (
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <line x1="6" y1="20" x2="6" y2="13" />
                                            <line x1="12" y1="20" x2="12" y2="8" />
                                            <line x1="18" y1="20" x2="18" y2="4" />
                                        </svg>
                                    );
                                }
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setSection(item.id)}
                                        style={{
                                            width: "100%", display: "flex", alignItems: "center", gap: 11,
                                            padding: "11px 14px", borderRadius: 9, marginBottom: 4,
                                            border: "none", cursor: "pointer",
                                            background: isActive ? "#2C5F8D" : "transparent",
                                            color: isActive ? "white" : "#64748b",
                                            fontSize: 14, fontWeight: isActive ? 700 : 600,
                                            fontFamily: "'DM Sans',sans-serif", textAlign: "left",
                                            transition: "all .15s",
                                        }}
                                        onMouseEnter={e => { if (!isActive) { e.currentTarget.style.background = "#f3f6fa"; e.currentTarget.style.color = "#0f172a"; } }}
                                        onMouseLeave={e => { if (!isActive) { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "#64748b"; } }}>
                                        <span style={{ display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{iconSvg}</span>
                                        <span>{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>
                    </div>

                    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
                        <div style={{ background: "white", borderBottom: "1px solid #e2e8f0", padding: "0 28px", height: 54, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
                            <div style={{ fontSize: 15, fontWeight: 700, color: "#0f172a" }}>
                                {nav.find(n => n.id === section)?.label || ""}
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                                <div style={{ fontSize: 12, color: "#64748b", display: "flex", alignItems: "center", gap: 5 }}>
                                    <span style={{ color: "#f59e0b" }}>⭐</span>
                                    <span style={{ fontWeight: 600 }}>69%</span> overall
                                </div>
                                <div style={{ width: 34, height: 34, borderRadius: "50%", background: "#f3f4f6", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, color: "white", fontWeight: 700, cursor: "pointer" }}>T</div>
                            </div>
                        </div>

                        <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
                            {section === "practice-category" && <PracticeByCategorySection onStartExam={handleStartExam} computeStats={computeStats} applyFilter={applyFilter} />}
                            {section === "full-nclex" && <FullNCLEXSection onStartExam={handleStartExam} consumedExams={consumedExams} />}
                            {section === "progress" && <ProgressSection />}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
</body>

</html>
