        // ═══════════════════════════════════════════════════════
        // QUESTION INTERFACE
        // ═══════════════════════════════════════════════════════
        function QuestionInterface({ questions, mode, title, onFinish, examMeta, onSessionEnd }) {
            const [current, setCurrent] = useState(0);
            const [selected, setSelected] = useState(null);
            const [revealed, setRevealed] = useState(false);
            const [answers, setAnswers] = useState({});
            const [flagged, setFlagged] = useState({});
            const [showNav, setShowNav] = useState(false);
            const [showCalc, setShowCalc] = useState(false);
            const [timeLeft, setTimeLeft] = useState(mode === "test" ? 9000 : null);
            const [finished, setFinished] = useState(false);
            const [paused, setPaused] = useState(false);
            const [reviewFilter, setReviewFilter] = useState("all");
            const [showExitConfirm, setShowExitConfirm] = useState(false);

            // Notify parent of session results (used for question history + consumed-exam tracking)
            // Then call onFinish to actually leave. For full exams in review, show confirm first.
            const attemptExit = () => {
                const isFullExamInReview = examMeta && examMeta.isFullExam && finished;
                if (isFullExamInReview) {
                    setShowExitConfirm(true);
                    return;
                }
                confirmExit();
            };
            const confirmExit = () => {
                if (onSessionEnd) {
                    onSessionEnd({
                        answers,
                        flagged,
                        isAnswerScored,
                        examId: examMeta ? examMeta.examId : null,
                        isFullExam: examMeta ? examMeta.isFullExam : false,
                    });
                }
                onFinish();
            };

            const q = questions[current];

            useEffect(() => {
                if (mode === "test" && timeLeft > 0 && !finished && !paused) {
                    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
                    return () => clearTimeout(t);
                }
                if (timeLeft === 0) handleFinish();
            }, [timeLeft, finished, paused]);

            useEffect(() => {
                if (answers[current] !== undefined) {
                    setSelected(answers[current]);
                    if (mode === "practice") setRevealed(true);
                } else {
                    setSelected(null);
                    setRevealed(false);
                }
            }, [current]);

            const handleSelect = i => {
                if (answers[current] !== undefined) return;
                if (q.multiSelect || q.type === "extended-multi") {
                    // Toggle in array
                    const cur = Array.isArray(selected) ? selected : [];
                    const next = cur.includes(i) ? cur.filter(x => x !== i) : [...cur, i].sort((a, b) => a - b);
                    setSelected(next);
                    // Don't auto-submit for multi-select even in tutorial mode — user needs Submit button
                } else {
                    setSelected(i);
                    if (mode === "practice") {
                        setRevealed(true);
                        setAnswers(a => ({ ...a, [current]: i }));
                    }
                }
            };

            // Matrix: pick column for a specific row
            const handleMatrixSelect = (rowIdx, colIdx) => {
                if (answers[current] !== undefined) return;
                const cur = Array.isArray(selected) ? [...selected] : new Array(q.matrixRows.length).fill(undefined);
                cur[rowIdx] = colIdx;
                setSelected(cur);
                // Don't auto-submit — wait for user to fill all rows then click Submit
            };

            // Cloze: pick option for a specific blank
            const handleClozeSelect = (blankIdx, optionIdx) => {
                if (answers[current] !== undefined) return;
                const cur = Array.isArray(selected) ? [...selected] : new Array(q.clozeBlanks.length).fill(undefined);
                cur[blankIdx] = optionIdx;
                setSelected(cur);
            };

            const lockTestAnswer = (targetIdx) => {
                if (mode === "test" && selected !== null && answers[current] === undefined) {
                    const hasAnswer = Array.isArray(selected) ? selected.length > 0 : true;
                    if (hasAnswer) setAnswers(a => ({ ...a, [current]: selected }));
                }
                setCurrent(targetIdx);
            };

            const handleFinish = () => {
                if (mode === "practice") setFinished(true);
                else { setRevealed(true); setFinished(true); }
            };

            // Compare a user answer (number or array) against the correct answer (number or array)
            const isAnswerCorrect = (userAns, correctAns) => {
                if (Array.isArray(correctAns)) {
                    if (!Array.isArray(userAns)) return false;
                    if (userAns.length !== correctAns.length) return false;
                    const sortedUser = [...userAns].sort((a, b) => a - b);
                    const sortedCorrect = [...correctAns].sort((a, b) => a - b);
                    return sortedUser.every((v, i) => v === sortedCorrect[i]);
                }
                return userAns === correctAns;
            };

            // NGN-style polytomous scoring: +1 correct, -1 incorrect, capped at 0
            // Returns { percent: 0-100, points: number, max: number, isFullCorrect: bool }
            // Question is counted as "Correct" in the tally if percent >= 80
            const PARTIAL_CREDIT_TYPES = ["extended-multi", "matrix", "bowtie", "cloze"];
            const getCredit = (question, userAns) => {
                if (userAns === undefined || userAns === null) {
                    return { percent: 0, points: 0, max: 1, isFullCorrect: false, answered: false };
                }
                const correctAns = question.correct;

                // Matrix: userAns is array of column-indices (one per row); correctAns same shape
                // Score = number of rows with correct pick
                if (question.type === "matrix") {
                    const max = correctAns.length;
                    const userArr = Array.isArray(userAns) ? userAns : [];
                    let points = 0;
                    for (let r = 0; r < max; r++) {
                        if (userArr[r] === correctAns[r]) points++;
                    }
                    const percent = Math.round((points / max) * 100);
                    return { percent, points, max, isFullCorrect: points === max, answered: true };
                }

                // Cloze: userAns is array of blank-indices (one per blank); correctAns same shape
                // Score = number of blanks filled correctly
                if (question.type === "cloze") {
                    const max = correctAns.length;
                    const userArr = Array.isArray(userAns) ? userAns : [];
                    let points = 0;
                    for (let b = 0; b < max; b++) {
                        if (userArr[b] === correctAns[b]) points++;
                    }
                    const percent = Math.round((points / max) * 100);
                    return { percent, points, max, isFullCorrect: points === max, answered: true };
                }

                // Fill-in-the-Blank: numeric (with tolerance) or text (case-insensitive list)
                if (question.type === "fill-blank") {
                    const cfg = question.blankInput || {};
                    let ok = false;
                    if (cfg.kind === "numeric") {
                        const userNum = parseFloat(userAns);
                        const correctNum = parseFloat(cfg.correct);
                        const tolerance = cfg.tolerance != null ? parseFloat(cfg.tolerance) : 0;
                        if (!isNaN(userNum) && !isNaN(correctNum)) {
                            ok = Math.abs(userNum - correctNum) <= tolerance;
                        }
                    } else {
                        // text mode — accepts an array of acceptable answers OR a single string
                        const acceptable = Array.isArray(cfg.correct) ? cfg.correct : [cfg.correct];
                        const norm = (s) => cfg.caseSensitive ? String(s).trim() : String(s).trim().toLowerCase();
                        const u = norm(userAns);
                        ok = acceptable.some(a => norm(a) === u);
                    }
                    return { percent: ok ? 100 : 0, points: ok ? 1 : 0, max: 1, isFullCorrect: ok, answered: true };
                }

                const usePartial = PARTIAL_CREDIT_TYPES.includes(question.type);

                // Single-select (multiple choice)
                if (!Array.isArray(correctAns)) {
                    const ok = userAns === correctAns;
                    return { percent: ok ? 100 : 0, points: ok ? 1 : 0, max: 1, isFullCorrect: ok, answered: true };
                }

                // Array correct, array user — multi-select / SATA / extended / matrix
                const userArr = Array.isArray(userAns) ? userAns : [userAns];
                const correctSet = new Set(correctAns);
                const userSet = new Set(userArr);

                if (!usePartial) {
                    // SATA / regular multi-select: all-or-nothing
                    const allRight = correctAns.length === userArr.length &&
                        correctAns.every(c => userSet.has(c));
                    return { percent: allRight ? 100 : 0, points: allRight ? 1 : 0, max: 1, isFullCorrect: allRight, answered: true };
                }

                // Polytomous: +1 for each correct selection, -1 for each incorrect, floor at 0
                const max = correctAns.length;
                let points = 0;
                userArr.forEach(u => {
                    if (correctSet.has(u)) points += 1;
                    else points -= 1;
                });
                points = Math.max(0, points);
                const percent = Math.round((points / max) * 100);
                return { percent, points, max, isFullCorrect: percent === 100, answered: true };
            };

            // Wrapper used wherever we just need a yes/no
            const isAnswerScored = (question, userAns) => {
                if (userAns === undefined || userAns === null) return false;
                return getCredit(question, userAns).percent >= 80;
            };

            const score = useMemo(() => {
                const answered = Object.keys(answers).length;
                const correct = Object.entries(answers).filter(([idx, ans]) => isAnswerScored(questions[+idx], ans)).length;
                return { answered, correct, total: questions.length, pct: answered > 0 ? Math.round((correct / answered) * 100) : 0 };
            }, [answers, questions]);

            const fmtTime = s => {
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const sec = s % 60;
                const pad = n => n.toString().padStart(2, "0");
                return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
            };

            const isAnswered = answers[current] !== undefined;
            const userAnswer = answers[current];
            const isCorrectAns = q ? isAnswerScored(q, userAnswer) : false;

            // ── RESULTS SCREEN ──────────────────────────────────
            if (finished) {
                const pass = score.pct >= 70;
                return (
                    <>
                        <div style={{ flex: 1, overflow: "auto", background: "#f4f6f9", padding: "28px 32px", position: "relative" }}>
                            <div style={{ maxWidth: 860, margin: "0 auto", animation: "fadeUp .4s ease" }}>

                                {/* Hero */}
                                <div style={{ background: "white", borderRadius: 18, padding: "36px", marginBottom: 18, textAlign: "center", border: "1px solid #e2e8f0", boxShadow: "0 2px 16px rgba(0,0,0,.06)" }}>
                                    <div style={{ fontSize: 12, color: "#94a3b8", fontWeight: 600, letterSpacing: ".1em", textTransform: "uppercase", marginBottom: 10 }}>Session Complete — {title}</div>
                                    <div style={{ fontSize: 64, fontWeight: 900, color: pass ? "#16a34a" : "#dc2626", lineHeight: 1, marginBottom: 8, fontFamily: "'DM Serif Display',serif" }}>{score.pct}%</div>
                                    <div style={{ fontSize: 16, color: "#64748b", marginBottom: 20 }}>{score.correct} of {score.total} correct</div>
                                    <div style={{ display: "inline-flex", alignItems: "center", padding: "9px 22px", background: pass ? "#dcfce7" : "#fee2e2", borderRadius: 99, color: pass ? "#166534" : "#991b1b", fontWeight: 700, fontSize: 14 }}>
                                        {pass ? "✓ Passing Score — Great work!" : "Keep Practicing — You're Getting There!"}
                                    </div>
                                </div>

                                {/* Stats — clickable filter cards */}
                                <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 10, marginBottom: 14 }}>
                                    {[
                                        { key: "all", label: "All", val: score.total, color: "#2C5F8D" },
                                        { key: "correct", label: "Correct", val: score.correct, color: "#16a34a" },
                                        { key: "incorrect", label: "Incorrect", val: score.answered - score.correct, color: "#dc2626" },
                                        { key: "flagged", label: "Flagged", val: Object.values(flagged).filter(Boolean).length, color: "#d97706" },
                                        { key: "skipped", label: "Skipped", val: score.total - score.answered, color: "#94a3b8" },
                                    ].map(s => {
                                        const isActive = reviewFilter === s.key;
                                        return (
                                            <button
                                                key={s.key}
                                                onClick={() => setReviewFilter(s.key)}
                                                style={{
                                                    background: "white", borderRadius: 14, padding: "16px 14px",
                                                    border: `1.5px solid ${isActive ? s.color : "#e2e8f0"}`,
                                                    textAlign: "center", cursor: "pointer",
                                                    transition: "all .15s",
                                                    boxShadow: isActive ? `0 0 0 3px ${s.color}1a, 0 1px 3px rgba(0,0,0,.04)` : "0 1px 3px rgba(0,0,0,.04)",
                                                    fontFamily: "'DM Sans',sans-serif",
                                                }}
                                                onMouseEnter={e => { if (!isActive) e.currentTarget.style.borderColor = "#cbd5e1"; }}
                                                onMouseLeave={e => { if (!isActive) e.currentTarget.style.borderColor = "#e2e8f0"; }}>
                                                <div style={{ fontSize: 26, fontWeight: 800, color: s.color, lineHeight: 1 }}>{s.val}</div>
                                                <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4, fontWeight: 500 }}>{s.label}</div>
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Pill filter row — Archer-style */}
                                <div style={{ display: "inline-flex", background: "white", border: "1px solid #e2e8f0", borderRadius: 99, padding: 4, marginBottom: 14, boxShadow: "0 1px 3px rgba(0,0,0,.04)" }}>
                                    {[
                                        { key: "all", label: "ALL" },
                                        { key: "correct", label: "CORRECT" },
                                        { key: "incorrect", label: "INCORRECT" },
                                        { key: "flagged", label: "FLAGGED" },
                                        { key: "skipped", label: "OMITTED" },
                                    ].map(p => {
                                        const isActive = reviewFilter === p.key;
                                        return (
                                            <button
                                                key={p.key}
                                                onClick={() => setReviewFilter(p.key)}
                                                style={{
                                                    padding: "7px 16px", borderRadius: 99, border: "none",
                                                    background: isActive ? "#2C5F8D" : "transparent",
                                                    color: isActive ? "white" : "#64748b",
                                                    fontSize: 11, fontWeight: 700, letterSpacing: ".06em",
                                                    cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
                                                    transition: "all .15s",
                                                }}
                                                onMouseEnter={e => { if (!isActive) e.currentTarget.style.color = "#0f172a"; }}
                                                onMouseLeave={e => { if (!isActive) e.currentTarget.style.color = "#64748b"; }}>
                                                {p.label}
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Review */}
                                <div style={{ background: "white", borderRadius: 16, border: "1px solid #e2e8f0", overflow: "hidden" }}>
                                    <div style={{ padding: "18px 24px", borderBottom: "1px solid #f1f5f9", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                                        <div style={{ fontSize: 15, fontWeight: 700, color: "#0f172a" }}>
                                            {reviewFilter === "all" ? "Full Question Review" :
                                                reviewFilter === "correct" ? "Correct Answers" :
                                                    reviewFilter === "incorrect" ? "Incorrect Answers" :
                                                        reviewFilter === "flagged" ? "Flagged Questions" :
                                                            "Skipped Questions"}
                                        </div>
                                        <div style={{ fontSize: 12, color: "#94a3b8" }}>
                                            {(() => {
                                                const filtered = questions.filter((qq, i) => {
                                                    const userAns = answers[i];
                                                    const unans = userAns === undefined;
                                                    if (reviewFilter === "all") return true;
                                                    if (reviewFilter === "correct") return !unans && isAnswerScored(qq, userAns);
                                                    if (reviewFilter === "incorrect") return !unans && !isAnswerScored(qq, userAns);
                                                    if (reviewFilter === "flagged") return !!flagged[i];
                                                    if (reviewFilter === "skipped") return unans;
                                                    return true;
                                                });
                                                return `Showing ${filtered.length} of ${questions.length}`;
                                            })()}
                                        </div>
                                    </div>
                                    {(() => {
                                        // Filter the questions according to active review filter
                                        const visibleEntries = questions
                                            .map((qq, i) => ({ qq, i }))
                                            .filter(({ qq, i }) => {
                                                const userAns = answers[i];
                                                const unans = userAns === undefined;
                                                if (reviewFilter === "all") return true;
                                                if (reviewFilter === "correct") return !unans && isAnswerScored(qq, userAns);
                                                if (reviewFilter === "incorrect") return !unans && !isAnswerScored(qq, userAns);
                                                if (reviewFilter === "flagged") return !!flagged[i];
                                                if (reviewFilter === "skipped") return unans;
                                                return true;
                                            });

                                        if (visibleEntries.length === 0) {
                                            return (
                                                <div style={{ padding: "60px 24px", textAlign: "center" }}>
                                                    <div style={{ fontSize: 32, marginBottom: 12, opacity: .4 }}>—</div>
                                                    <div style={{ fontSize: 14, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>No questions match this filter</div>
                                                    <div style={{ fontSize: 12, color: "#94a3b8" }}>
                                                        {reviewFilter === "flagged" && "You didn't flag any questions in this session."}
                                                        {reviewFilter === "skipped" && "You answered every question — nothing skipped."}
                                                        {reviewFilter === "incorrect" && "Perfect score — no incorrect answers!"}
                                                        {reviewFilter === "correct" && "No correct answers in this session."}
                                                    </div>
                                                </div>
                                            );
                                        }

                                        return visibleEntries.map(({ qq, i }, idx) => {
                                            const userAns = answers[i];
                                            const isCorrect = isAnswerScored(qq, userAns);
                                            const credit = getCredit(qq, userAns);
                                            const unans = userAns === undefined;
                                            return (
                                                <div key={i} style={{ padding: "20px 24px", borderBottom: idx < visibleEntries.length - 1 ? "1px solid #f8fafc" : "none" }}>
                                                    <div style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 14 }}>
                                                        {/* Number bubble — green/amber/red/gray for full/partial/wrong/skipped */}
                                                        {(() => {
                                                            const isPartial = !unans && !isCorrect && credit.points > 0;
                                                            const bubbleBg = unans ? "#f1f5f9" : isCorrect ? "#dcfce7" : isPartial ? "#fef3c7" : "#fee2e2";
                                                            const bubbleColor = unans ? "#94a3b8" : isCorrect ? "#16a34a" : isPartial ? "#d97706" : "#dc2626";
                                                            const bubbleBorder = unans ? "#e2e8f0" : isCorrect ? "#86efac" : isPartial ? "#fcd34d" : "#fca5a5";
                                                            const bubbleContent = unans ? (i + 1) : isCorrect ? "✓" : isPartial ? `${credit.percent}%` : "✗";
                                                            return (
                                                                <div style={{
                                                                    width: isPartial ? 40 : 32, height: 32, borderRadius: isPartial ? 16 : "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: isPartial ? 10 : 12,
                                                                    background: bubbleBg, color: bubbleColor, border: `2px solid ${bubbleBorder}`
                                                                }}>
                                                                    {bubbleContent}
                                                                </div>
                                                            );
                                                        })()}
                                                        <div style={{ flex: 1 }}>
                                                            <div style={{ fontSize: 14, color: "#1e293b", lineHeight: 1.65, marginBottom: 12, fontWeight: 500 }}>{qq.question}</div>

                                                            {/* User's answer summary */}
                                                            <div style={{ display: "flex", gap: 10, fontSize: 12, marginBottom: 14, flexWrap: "wrap" }}>
                                                                <span style={{ color: "#94a3b8" }}>Your answer:</span>
                                                                <span style={{ fontWeight: 600, color: unans ? "#94a3b8" : isCorrect ? "#16a34a" : credit.points > 0 ? "#d97706" : "#dc2626" }}>
                                                                    {unans ? "Skipped"
                                                                        : qq.type === "matrix" ? `${credit.points} of ${credit.max} rows correct`
                                                                            : qq.type === "cloze" ? `${credit.points} of ${credit.max} blanks correct`
                                                                                : qq.type === "fill-blank" ? (String(userAns).trim() || "(empty)")
                                                                                    : Array.isArray(userAns) ? userAns.map(ai => ["A", "B", "C", "D", "E", "F", "G", "H"][ai]).join(", ")
                                                                                        : qq.options[userAns]}
                                                                </span>
                                                                {!isCorrect && !unans && qq.type !== "matrix" && qq.type !== "cloze" && (
                                                                    <>
                                                                        <span style={{ color: "#94a3b8" }}>Correct:</span>
                                                                        <span style={{ fontWeight: 600, color: "#16a34a" }}>{
                                                                            qq.type === "fill-blank" ? (() => {
                                                                                const cfg = qq.blankInput || {};
                                                                                const c = Array.isArray(cfg.correct) ? cfg.correct[0] : cfg.correct;
                                                                                return `${c}${cfg.unit ? ` ${cfg.unit}` : ""}`;
                                                                            })()
                                                                                : Array.isArray(qq.correct) ? qq.correct.map(ci => ["A", "B", "C", "D", "E", "F", "G", "H"][ci]).join(", ")
                                                                                    : qq.options[qq.correct]
                                                                        }</span>
                                                                    </>
                                                                )}
                                                                {!isCorrect && !unans && credit.points > 0 && (
                                                                    <span style={{ padding: "1px 8px", borderRadius: 99, background: "#fef3c7", color: "#92400e", fontWeight: 700, fontSize: 11 }}>
                                                                        {credit.percent}% credit
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                        {flagged[i] && <span style={{ color: "#f59e0b", fontSize: 16, flexShrink: 0 }}>⚑</span>}
                                                    </div>

                                                    {/* New rationale block */}
                                                    <div style={{ marginLeft: 46 }}>
                                                        <RationaleBlock question={qq} userAnswer={userAns} />
                                                        <QuestionStats question={qq} />
                                                    </div>
                                                </div>
                                            );
                                        });
                                    })()}
                                </div>

                                <div style={{ display: "flex", gap: 10, marginTop: 20, justifyContent: "center" }}>
                                    <button className="btn-ghost" onClick={attemptExit}>← Back to Practice</button>
                                    {!(examMeta && examMeta.isFullExam) && (
                                        <button className="btn-primary" onClick={() => { setCurrent(0); setSelected(null); setRevealed(false); setAnswers({}); setFlagged({}); setFinished(false); setTimeLeft(mode === "test" ? 9000 : null); }}>
                                            Retry Session ↺
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Exit-confirm overlay (results screen instance) */}
                        {showExitConfirm && (
                            <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,.7)", zIndex: 400, display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(6px)", padding: 20 }}>
                                <div style={{ background: "white", borderRadius: 14, padding: 28, maxWidth: 480, width: "100%", boxShadow: "0 24px 60px rgba(0,0,0,.25)", animation: "scaleIn .2s ease" }}>
                                    <div style={{ display: "flex", alignItems: "flex-start", gap: 14, marginBottom: 16 }}>
                                        <div style={{ width: 40, height: 40, borderRadius: 10, background: "#fee2e2", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                                            </svg>
                                        </div>
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <div style={{ fontSize: 17, fontWeight: 800, color: "#0f172a", marginBottom: 6, fontFamily: "'DM Sans',sans-serif", letterSpacing: "-.01em" }}>Lock and exit this exam?</div>
                                            <div style={{ fontSize: 13.5, color: "#475569", lineHeight: 1.65 }}>
                                                This is a <strong>Next-Gen NCLEX RN Simulator</strong> exam. Once you exit, this exam will be <strong style={{ color: "#dc2626" }}>permanently locked</strong> — you won't be able to retake it or review your answers again.
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{ background: "#fef3c7", border: "1px solid #fde68a", borderRadius: 8, padding: "10px 14px", marginBottom: 10, fontSize: 12, color: "#78350f", lineHeight: 1.55 }}>
                                        💡 If you'd like to spend more time reviewing your rationales, click Cancel — there's no time limit on the review screen.
                                    </div>
                                    <div style={{ background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 8, padding: "10px 14px", marginBottom: 18, fontSize: 12, color: "#7f1d1d", lineHeight: 1.55, display: "flex", gap: 9, alignItems: "flex-start" }}>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
                                            <rect x="3" y="11" width="18" height="11" rx="2" />
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                        </svg>
                                        <span><strong>Account Integrity Notice:</strong> Sharing exam content, taking screenshots, downloading, copying, or pasting any part of this exam will result in <strong>permanent termination of your account</strong> with no refund.</span>
                                    </div>
                                    <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                                        <button onClick={() => setShowExitConfirm(false)}
                                            style={{ background: "white", color: "#475569", border: "1.5px solid #e2e8f0", borderRadius: 8, padding: "10px 20px", fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all .15s" }}
                                            onMouseEnter={e => { e.currentTarget.style.background = "#f8fafc"; e.currentTarget.style.borderColor = "#cbd5e1"; }}
                                            onMouseLeave={e => { e.currentTarget.style.background = "white"; e.currentTarget.style.borderColor = "#e2e8f0"; }}>
                                            Cancel — keep reviewing
                                        </button>
                                        <button onClick={() => { setShowExitConfirm(false); confirmExit(); }}
                                            style={{ background: "#dc2626", color: "white", border: "none", borderRadius: 8, padding: "10px 20px", fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 700, cursor: "pointer", transition: "background .15s" }}
                                            onMouseEnter={e => e.currentTarget.style.background = "#991b1b"}
                                            onMouseLeave={e => e.currentTarget.style.background = "#dc2626"}>
                                            Lock exam &amp; exit
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </>
                );
            }

            // ── QUESTION SCREEN ─────────────────────────────────
            return (
                <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", background: "#f4f6f9", position: "relative" }}>

                    {/* TOP STATUS BAR — navy brand */}
                    <div style={{ background: "#2C5F8D", padding: "0 16px", height: 46, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, zIndex: 11, color: "white", gap: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0, flex: "0 1 auto" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                                <span style={{ fontSize: 14, fontWeight: 800, fontFamily: "'DM Serif Display',serif", letterSpacing: "-.02em", whiteSpace: "nowrap" }}>STEM<span style={{ color: "#FE5E7E" }}>RN</span></span>
                                <span style={{ fontSize: 11, opacity: .7, whiteSpace: "nowrap", display: window.innerWidth < 640 ? "none" : "inline" }}>—</span>
                                <span style={{ fontSize: 11, fontWeight: 600, opacity: .85, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", display: window.innerWidth < 640 ? "none" : "inline" }}>Student</span>
                            </div>
                        </div>

                        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", lineHeight: 1.2, flex: "1 1 auto", textAlign: "center", minWidth: 0, padding: "0 8px" }}>
                            <div style={{ fontSize: 11, fontWeight: 600, opacity: .95, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: "100%" }}>
                                {(examMeta && examMeta.isFullExam) ? title : (mode === "test" ? "Timed Tutorial" : "Tutorial Mode")}
                            </div>
                            <div style={{ fontSize: 10, opacity: .65, whiteSpace: "nowrap" }}>QID: {q?.id?.replace(/^q/, "") || "—"}</div>
                        </div>

                        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", lineHeight: 1.35, flex: "0 1 auto", gap: 3 }}>
                            {mode === "test" && timeLeft !== null && (
                                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600, color: timeLeft < 60 ? "#fecaca" : "white", whiteSpace: "nowrap" }}>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                                        <circle cx="12" cy="12" r="10" />
                                        <polyline points="12 6 12 12 16 14" />
                                    </svg>
                                    <span>Time Remaining&nbsp;:&nbsp;<span style={{ fontFamily: "'DM Mono',monospace", fontWeight: 700 }}>{fmtTime(timeLeft)}</span></span>
                                </div>
                            )}
                            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 600, opacity: .95, whiteSpace: "nowrap" }}>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                                    <rect x="4" y="5" width="16" height="16" rx="2" />
                                    <path d="M9 5V3h6v2" />
                                    <line x1="8" y1="11" x2="16" y2="11" />
                                    <line x1="8" y1="15" x2="13" y2="15" />
                                </svg>
                                <span>{current + 1} of {questions.length}</span>
                            </div>
                        </div>
                    </div>

                    {/* SECONDARY TOOLBAR — lighter blue with tools */}
                    <div style={{ background: "#3a7ab2", padding: "0 12px", height: 38, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, zIndex: 10, gap: 6 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <button onClick={() => setFlagged(f => ({ ...f, [current]: !f[current] }))}
                                style={{
                                    display: "flex", alignItems: "center", gap: 5, padding: "4px 9px", border: "none", borderRadius: 5,
                                    background: flagged[current] ? "rgba(255,255,255,.22)" : "transparent",
                                    color: "white", cursor: "pointer", transition: "all .15s", fontSize: 11, fontWeight: 600, fontFamily: "'DM Sans',sans-serif", letterSpacing: ".04em"
                                }}>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill={flagged[current] ? "#fde047" : "none"} stroke={flagged[current] ? "#fde047" : "white"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
                                    <path d="M4 21V4h13l-2 4 2 4H4" />
                                </svg>
                                <span style={{ whiteSpace: "nowrap" }}>{flagged[current] ? "FLAGGED" : "MARK FOR LATER"}</span>
                            </button>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <button onClick={() => setShowCalc(s => !s)} title="Calculator"
                                style={{
                                    width: 28, height: 28, border: "none", borderRadius: 5,
                                    background: showCalc ? "rgba(255,255,255,.22)" : "transparent",
                                    color: "white", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center"
                                }}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

                                    <line x1="8" y1="16" x2="8" y2="16" />
                                    <line x1="12" y1="16" x2="12" y2="16" />

                                }}>

                                    <rect x="14" y="3" width="7" height="7" rx="1" />
                                    <rect x="3" y="14" width="7" height="7" rx="1" />
                                    <rect x="14" y="14" width="7" height="7" rx="1" />

                    </div>

                    {/* SPLIT LAYOUT */}
                    <div className="q-split" style={{ flex: 1, display: "flex", overflow: "hidden" }}>

                        {/* LEFT — Question */}
                        <div className="q-main-pad" style={{ flex: 1, overflow: "auto", padding: "22px 24px", borderRight: revealed ? "1px solid #e2e8f0" : "none", minWidth: 0 }}>
                            <div style={{ maxWidth: 920, margin: "0", animation: "fadeUp .25s ease" }}>

                                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
                                    <span style={{ fontSize: 13, color: "#94a3b8", fontWeight: 600 }}>Q{current + 1}</span>
                                    <span style={{ width: 4, height: 4, borderRadius: "50%", background: "#cbd5e1" }} />
                                    <span style={{ padding: "2px 9px", borderRadius: 99, background: "#eef4fb", color: "#2C5F8D", fontSize: 11, fontWeight: 700 }}>{q.category}</span>
                                    <span style={{
                                        padding: "2px 9px", borderRadius: 99, fontSize: 11, fontWeight: 600,
                                        background: q.difficulty === "beginner" ? "#dcfce7" : q.difficulty === "advanced" ? "#fee2e2" : "#fef3c7",
                                        color: q.difficulty === "beginner" ? "#166534" : q.difficulty === "advanced" ? "#991b1b" : "#92400e"

                                        {q.difficulty.charAt(0).toUpperCase() + q.difficulty.slice(1)}
                                    </span>
                                    {(() => {
                                        // Question type pill — purple for NGN partial-credit types
                                        let typeLabel = null;
                                        if (q.type === "extended-multi") typeLabel = "Extended MR";
                                        else if (q.type === "matrix") typeLabel = "Matrix";
                                        else if (q.type === "cloze") typeLabel = "Drop-Down";
                                        else if (q.type === "highlight") typeLabel = "Highlight";
                                        else if (q.type === "rank") typeLabel = "Rank Order";
                                        else if (q.type === "bowtie") typeLabel = "Bowtie";
                                        else if (q.type === "trend") typeLabel = "Trend";
                                        else if (q.type === "fill-blank") typeLabel = "Fill-in-the-Blank";
                                        else if (q.multiSelect) typeLabel = "SATA";
                                        if (!typeLabel) return null;
                                        const isPartialCredit = ["extended-multi", "matrix", "bowtie", "cloze"].includes(q.type);
                                        return (
                                            <span style={{
                                                padding: "2px 9px", borderRadius: 99, fontSize: 11, fontWeight: 700,
                                                background: isPartialCredit ? "#f5f3ff" : "#fef3f2",

                                                border: `1px solid ${isPartialCredit ? "#ddd6fe" : "#fce7f3"}`

                                                {typeLabel}{isPartialCredit ? " ⚖" : ""}

                                        );
