<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>STEMRN — NCLEX Practice</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&family=DM+Mono&display=swap"
        rel="stylesheet" />
    <style>
        /* ═══════════════════════════════════════════════════
   STEMRN MINIMAL THEME — ElevenLabs-inspired
   All tools share this base
═══════════════════════════════════════════════════ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #root {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* Layout */
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .left-panel {
            width: 340px;
            min-width: 280px;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        .history-panel {
            width: 240px;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fafafa;
        }

        /* Typography */
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            font-family: 'DM Serif Display', serif;
            letter-spacing: -.3px;
        }

        .page-subtitle {
            font-size: 13px;
            color: #6b7280;
            margin-top: 3px;
            line-height: 1.5;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: #9ca3af;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        /* Cards */
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
        }

        .card:hover {
            border-color: #d1d5db;
        }

        .input-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s;
        }

        .input-card:hover {
            border-color: #1E3A5F;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, .06);
        }

        /* Tabs / Pills */
        .tab-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tab-pill {
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #e5e7eb;
            background: #fff;
            cursor: pointer;
            color: #6b7280;
            font-family: 'DM Sans', sans-serif;
            transition: all .13s;
            white-space: nowrap;
        }

        .tab-pill:hover {
            border-color: #1E3A5F;
            color: #1E3A5F;
        }

        .tab-pill.active {
            background: #1E3A5F;
            color: #fff;
            border-color: #1E3A5F;
        }

        /* Buttons */
        .btn-primary {
            background: #1E3A5F;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .btn-primary:hover {
            background: #162d4a;
        }

        .btn-primary:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .btn-ghost {
            background: transparent;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 7px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all .13s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-ghost:hover {
            background: #f9fafb;
            color: #111827;
            border-color: #d1d5db;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: 1px solid #e5e7eb;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .13s;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .btn-icon.active {
            background: #1E3A5F;
            border-color: #1E3A5F;
            color: #fff;
        }

        /* Input / Textarea */
        .input-field {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: #111827;
            background: #fff;
            transition: border-color .15s;
        }

        .input-field:focus {
            outline: none;
            border-color: #1E3A5F;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, .07);
        }

        .input-field::placeholder {
            color: #d1d5db;
        }

        textarea.input-field {
            resize: none;
            line-height: 1.65;
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0
            }

            100% {
                background-position: 200% 0
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(.97)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(8px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(4px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .15);
            animation: scaleIn .22s ease;
        }

        /* NCLEX Answer Options — modern design */
        /* ═══════════════════════════════════════════════════
   NCLEX Answer Options — minimal borderless (matches Archer reference)
═══════════════════════════════════════════════════ */
        .opt {
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 400;
            transition: background .12s, border-color .12s;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            line-height: 1.55;
            margin-bottom: 2px;
            color: #1e293b;
        }

        .opt:hover:not(:disabled) {
            background: #f3f6fa;
        }

        .opt:disabled {
            cursor: default;
        }

        .opt.selected {
            background: #eaf2fb;
        }

        .opt.ans-correct {
            background: #ecfdf3 !important;
            border-color: #bbf7d0 !important;
        }

        .opt.ans-wrong {
            background: #fdecef !important;
            border-color: #fca5a5 !important;
        }

        .opt.ans-neutral {
            background: transparent;
            opacity: .65;
        }

        /* Selection control on the left — radio (single) or checkbox (multi) */
        .opt-control {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            border: 1.5px solid #cbd5e1;
            background: #fff;
            transition: all .12s;
        }

        .opt-control.radio {
            border-radius: 50%;
        }

        .opt-control.checkbox {
            border-radius: 4px;
        }

        .opt-control-inner {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2C5F8D;
            opacity: 0;
            transition: opacity .12s;
        }

        .opt.selected .opt-control {
            border-color: #2C5F8D;
        }

        .opt.selected .opt-control-inner {
            opacity: 1;
        }

        .opt.selected .opt-control.checkbox {
            background: #2C5F8D;
            border-color: #2C5F8D;
        }

        /* When answered: control reflects user's pick */
        .opt.ans-correct .opt-control {
            border-color: #16a34a;
            background: #16a34a;
        }

        .opt.ans-wrong .opt-control {
            border-color: #FE5E7E;
            background: #FE5E7E;
        }

        .opt.ans-neutral .opt-control {
            border-color: #cbd5e1;
            background: #fff;
        }

        .opt-text {
            flex: 1;
            color: inherit;
            line-height: 1.55;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .opt.ans-neutral .opt-text {
            color: #94a3b8;
        }

        .opt-letter-inline {
            font-weight: 600;
            color: #475569;
            margin-right: 2px;
        }

        .opt.ans-correct .opt-letter-inline {
            color: #15803d;
        }

        .opt.ans-wrong .opt-letter-inline {
            color: #b91c1c;
        }

        .opt.ans-neutral .opt-letter-inline {
            color: #94a3b8;
        }

        /* Right-side check/x indicator (kept) */
        .opt-mark {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .opt-mark.correct {
            color: #16a34a;
        }

        .opt-mark.wrong {
            color: #FE5E7E;
        }

        /* Progress bar */
        .prog-bar {
            height: 5px;
            background: #e5e7eb;
            border-radius: 99px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            background: #1E3A5F;
            border-radius: 99px;
            transition: width .4s ease;
        }

        /* Nav items */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: all .13s;
            border: none;
            background: none;
            font-family: 'DM Sans', sans-serif;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .nav-item.active {
            background: #1E3A5F;
            color: #fff;
        }

        /* ═══════════════════════════════════════════════════
   NEW RATIONALE STYLING — matches reference design
═══════════════════════════════════════════════════ */
        .rat-wrap {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
        }

        .rat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }

        .rat-header-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .rat-check-badge {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #FE5E7E;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(254, 94, 126, .28);
        }

        .rat-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: -.01em;
        }

        .rat-auto {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #16a34a;
        }

        .rat-auto-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, .15);
        }

        .rat-body {
            padding: 18px 20px;
        }

        .rat-section {
            margin-bottom: 18px;
        }

        .rat-section:last-child {
            margin-bottom: 0;
        }

        .rat-section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 11px;
        }

        .rat-accent-bar {
            width: 3px;
            height: 14px;
            background: #FE5E7E;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .rat-section-title {
            font-size: 11px;
            font-weight: 700;
            color: #FE5E7E;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .rat-prose {
            font-size: 13.5px;
            color: #1e293b;
            line-height: 1.75;
            padding: 0 2px;
        }

        .rat-prose b,
        .rat-prose strong {
            color: #0f172a;
            font-weight: 700;
        }

        .rat-prose p {
            margin-bottom: 10px;
        }

        .rat-prose p:last-child {
            margin-bottom: 0;
        }

        .rat-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 11px;
            margin-bottom: 8px;
            background: #fff;
            transition: all .15s;
        }

        .rat-card:last-child {
            margin-bottom: 0;
        }

        .rat-card.is-correct {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .rat-card-letter {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 800;
            font-family: 'DM Mono', monospace;
        }

        .rat-card-letter.wrong {
            background: #fde8ec;
            color: #FE5E7E;
        }

        .rat-card-letter.right {
            background: #dcfce7;
            color: #16a34a;
        }

        .rat-card-text {
            flex: 1;
            font-size: 13px;
            color: #475569;
            line-height: 1.65;
            padding-top: 2px;
        }

        .rat-card-text .lbl {
            font-weight: 700;
        }

        .rat-card-text .lbl.wrong-lbl {
            color: #FE5E7E;
        }

        .rat-card-text .lbl.right-lbl {
            color: #16a34a;
        }

        .rat-card-text em {
            font-style: italic;
            color: #64748b;
        }

        /* Diagram block inside rationale */
        .rat-diagram {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: white;
            margin-top: 8px;
        }

        .rat-diagram-caption {
            padding: 6px 12px;
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
            font-size: 10px;
            color: #64748b;
            font-style: italic;
        }

        /* ═══════════════════════════════════════════════════
   Q-STATS BLOCK — appears below options after answer
═══════════════════════════════════════════════════ */
        .qstats {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #fff;
            padding: 22px 26px;
            margin-top: 20px;
            animation: fadeUp .25s ease;
        }

        .qstats-title {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 18px;
            letter-spacing: -.01em;
        }

        .qstats-grid {
            display: grid;
            grid-template-columns: auto 1px 1fr;
            gap: 24px;
            align-items: start;
        }

        .qstats-divider {
            width: 1px;
            background: #e5e7eb;
            align-self: stretch;
        }

        .qstats-row {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 13px;
            color: #475569;
            margin-bottom: 14px;
        }

        .qstats-row:last-child {
            margin-bottom: 0;
        }

        .qstats-row-icon {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        .qstats-row-icon.diff {
            background: #fde8ec;
            color: #FE5E7E;
        }

        .qstats-row-icon.peer {
            background: #ecfdf5;
            color: #16a34a;
        }

        .qstats-row-icon.cat {
            background: #fef3c7;
            color: #d97706;
        }

        .qstats-label {
            color: #64748b;
        }

        .qstats-value {
            font-weight: 700;
        }

        .qstats-value.coral {
            color: #FE5E7E;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .qstats-meta-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
            gap: 14px;
            margin-bottom: 11px;
        }

        .qstats-meta-row:last-child {
            margin-bottom: 0;
        }

        .qstats-meta-key {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .qstats-pill {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 99px;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            font-size: 12px;
            font-weight: 600;
        }

        .qstats-pill.cat {
            background: #fff7ed;
            color: #9a3412;
            border-color: #fed7aa;
        }

        /* ═══════════════════════════════════════════════════
   MATRIX / GRID question type — NGN
═══════════════════════════════════════════════════ */
        .matrix-wrap {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow-x: auto;
            background: white;
            margin-bottom: 18px;
            -webkit-overflow-scrolling: touch;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .matrix-table th {
            background: #f8fafc;
            color: #475569;
            padding: 10px 14px;
            text-align: center;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: .05em;
            text-transform: uppercase;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        .matrix-table th.row-head {
            text-align: left;
            width: auto;
        }

        .matrix-table td {
            padding: 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .matrix-table tr:last-child td {
            border-bottom: none;
        }

        .matrix-table tr:hover td {
            background: #fafbfc;
        }

        .matrix-row-label {
            padding: 12px 14px;
            font-size: 13px;
            color: #0f172a;
            font-weight: 500;
            line-height: 1.5;
        }

        .matrix-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 8px;
            cursor: pointer;
            border-left: 1px solid #f1f5f9;
            transition: background .12s;
            min-height: 46px;
        }

        .matrix-cell:hover {
            background: #f3f6fa;
        }

        .matrix-cell.disabled {
            cursor: default;
        }

        .matrix-cell.disabled:hover {
            background: transparent;
        }

        .matrix-radio {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1.5px solid #cbd5e1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all .12s;
        }

        .matrix-radio-inner {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2C5F8D;
            opacity: 0;
            transition: opacity .12s;
        }

        .matrix-cell.is-picked .matrix-radio {
            border-color: #2C5F8D;
        }

        .matrix-cell.is-picked .matrix-radio-inner {
            opacity: 1;
        }

        /* After-answer states */
        .matrix-cell.was-correct {
            background: #ecfdf3;
        }

        .matrix-cell.was-correct .matrix-radio {
            border-color: #16a34a;
            background: #16a34a;
        }

        .matrix-cell.was-correct .matrix-radio-inner {
            background: white;
            opacity: 1;
        }

        .matrix-cell.was-wrong {
            background: #fdecef;
        }

        .matrix-cell.was-wrong .matrix-radio {
            border-color: #FE5E7E;
            background: #FE5E7E;
        }

      <text x="34" y="186" font-size="9" fill="#94a3b8">Discharge teaching = lowest priority (no immediate threat)</text>
    </svg>`
            },

        // ═══════════════════════════════════════════════════════
        // RATIONALE BLOCK COMPONENT — shared by live panel + results
        // ═══════════════════════════════════════════════════════
        function RationaleBlock({ question, userAnswer }) {
            const q = question;
            return (
                <div className="rat-wrap" style={{ animation: "fadeIn .25s ease" }}>
                    {/* Header */}
                    <div className="rat-header">
                        <div className="rat-header-left">
                            <div className="rat-check-badge"><CheckIcon /></div>
                            <div className="rat-title">Rationale &amp; Explanation</div>
                        </div>
                        <div className="rat-auto">
                            <span className="rat-auto-dot" />
                            Auto
                        </div>
                    </div>

                    {/* Body */}
                    <div className="rat-body">

                        {/* CLINICAL REASONING */}
                        <div className="rat-section">
                            <div className="rat-section-label">
                                <div className="rat-accent-bar" />
                                <div className="rat-section-title">Clinical Reasoning — Reading the Trend</div>
                            </div>
                            <div className="rat-prose">{q.rationale}</div>
                        </div>

                        {/* Diagram (if any) */}
                        {RATIONALE_IMAGES[q.id] && (
                            <div className="rat-section">
                                <div className="rat-diagram">
                                    <div dangerouslySetInnerHTML={{ __html: RATIONALE_IMAGES[q.id].svg }} style={{ display: "block", width: "100%" }} />
                                    <div className="rat-diagram-caption">{RATIONALE_IMAGES[q.id].caption}</div>
                                </div>
                            </div>
                        )}

                        {/* WHY OTHERS FAIL */}
                        <div className="rat-section">
                            <div className="rat-section-label">
                                <div className="rat-accent-bar" />
                                <div className="rat-section-title">{
                                    q.type === "matrix" ? "Row-by-Row Breakdown" :
                                        q.type === "cloze" ? "Blank-by-Blank Breakdown" :
                                            "Why Others Fail"
                                }</div>
                            </div>
                            <div>
                                {q.type === "cloze" ? (
                                    // Cloze: one card per blank
                                    q.clozeBlanks.map((blank, bi) => {
                                        const correctOpt = blank.correct;
                                        const userPicks = Array.isArray(userAnswer) ? userAnswer : [];
                                        const userOpt = userPicks[bi];
                                        const gotItRight = userOpt === correctOpt;
                                        const correctText = blank.options[correctOpt];
                                        const userText = userOpt !== undefined ? blank.options[userOpt] : "(blank)";
                                        const explanation = q.clozeExplanations ? q.clozeExplanations[bi] : "";
                                        return (
                                            <div key={bi} className={`rat-card${gotItRight ? " is-correct" : ""}`}>
                                                <div className={`rat-card-letter ${gotItRight ? "right" : "wrong"}`}>{bi + 1}</div>
                                                <div className="rat-card-text">
                                                    <div style={{ fontSize: 12, color: "#64748b", marginBottom: 4 }}>
                                                        Your pick: <span style={{ fontWeight: 600, color: gotItRight ? "#15803d" : "#b91c1c" }}>{userText}</span>
                                                        {!gotItRight && <> · Correct: <span style={{ fontWeight: 600, color: "#15803d" }}>{correctText}</span></>}
                                                    </div>
                                                    <span className={`lbl ${gotItRight ? "right-lbl" : "wrong-lbl"}`}>{gotItRight ? "Correct." : "Incorrect."}</span>
                                                    {" "}{explanation}
                                                </div>
                                            </div>
                                        );
                                    })
                                ) :
                                    q.type === "fill-blank" ? (
                                        // Fill-in-the-Blank: single card with user's answer vs correct
                                        (() => {
                                            const cfg = q.blankInput || {};
                                            let isUserCorrect = false;
                                            if (cfg.kind === "numeric") {
                                                const u = parseFloat(userAnswer), c = parseFloat(cfg.correct);
                                                const t = cfg.tolerance != null ? parseFloat(cfg.tolerance) : 0;
                                                isUserCorrect = !isNaN(u) && !isNaN(c) && Math.abs(u - c) <= t;
                                            } else {
                                                const acc = Array.isArray(cfg.correct) ? cfg.correct : [cfg.correct];
                                                const norm = (s) => cfg.caseSensitive ? String(s).trim() : String(s).trim().toLowerCase();
                                                isUserCorrect = userAnswer != null && acc.some(a => norm(a) === norm(userAnswer));
                                            }
                                            const correctText = Array.isArray(cfg.correct) ? cfg.correct[0] : cfg.correct;
                                            const userText = userAnswer != null && String(userAnswer).trim() !== "" ? String(userAnswer) : "(no answer)";
                                            return (
                                                <div className={`rat-card${isUserCorrect ? " is-correct" : ""}`}>
                                                    <div className={`rat-card-letter ${isUserCorrect ? "right" : "wrong"}`}>{isUserCorrect ? "✓" : "✗"}</div>
                                                    <div className="rat-card-text">
                                                        <div style={{ fontSize: 12, color: "#64748b", marginBottom: 4 }}>
                                                            Your answer: <span style={{ fontWeight: 600, color: isUserCorrect ? "#15803d" : "#b91c1c", fontFamily: cfg.kind === "numeric" ? "'DM Mono',monospace" : "inherit" }}>{userText}{cfg.unit && userAnswer != null ? ` ${cfg.unit}` : ""}</span>
                                                            {!isUserCorrect && (
                                                                <> · Correct: <span style={{ fontWeight: 600, color: "#15803d", fontFamily: cfg.kind === "numeric" ? "'DM Mono',monospace" : "inherit" }}>{correctText}{cfg.unit ? ` ${cfg.unit}` : ""}</span></>
                                                            )}
                                                        </div>
                                                        <span className={`lbl ${isUserCorrect ? "right-lbl" : "wrong-lbl"}`}>{isUserCorrect ? "Correct." : "Incorrect."}</span>
                                                        {cfg.kind === "numeric" && cfg.tolerance > 0 && (
                                                            <span style={{ fontSize: 11, color: "#64748b" }}> Acceptable range: ±{cfg.tolerance}{cfg.unit ? ` ${cfg.unit}` : ""}.</span>
                                                        )}
                                                        {Array.isArray(cfg.correct) && cfg.correct.length > 1 && (
                                                            <span style={{ fontSize: 11, color: "#64748b" }}> Also accepted: {cfg.correct.slice(1).join(", ")}.</span>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })()
                                    ) :
                                        q.type === "matrix" ? (
                                            // Matrix: one card per row showing the correct column + explanation
                                            q.matrixRows.map((row, ri) => {
                                                const correctCol = q.correct[ri];
                                                const userPicks = Array.isArray(userAnswer) ? userAnswer : [];
                                                const userCol = userPicks[ri];
                                                const gotItRight = userCol === correctCol;
                                                const explanation = q.matrixExplanations ? q.matrixExplanations[ri] : "";
                                                const labelMatch = explanation.match(/^(Indicated|Contraindicated|Non-essential)\.?\s*/i);
                                                const labelText = labelMatch ? labelMatch[1].charAt(0).toUpperCase() + labelMatch[1].slice(1).toLowerCase() + "." : (q.matrixCols[correctCol] + ".");
                                                const restText = labelMatch ? " " + explanation.replace(labelMatch[0], "") : " " + explanation;
                                                return (
                                                    <div key={ri} className={`rat-card${gotItRight ? " is-correct" : ""}`}>
                                                        <div className={`rat-card-letter ${gotItRight ? "right" : "wrong"}`}>{ri + 1}</div>
                                                        <div className="rat-card-text">
                                                            <div style={{ fontSize: 12, color: "#64748b", fontWeight: 600, marginBottom: 3 }}>{row}</div>
                                                            <span className={`lbl ${gotItRight ? "right-lbl" : "wrong-lbl"}`}>{labelText}</span>
                                                            {restText}
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        ) : (
                                            q.options.map((opt, oi) => {
                                                const isCorrect = Array.isArray(q.correct) ? q.correct.includes(oi) : oi === q.correct;
                                                const letter = ["A", "B", "C", "D", "E", "F", "G", "H"][oi];
                                                const explanation = q.optionExplanations ? q.optionExplanations[oi] : "";

                                                // Extract a short bold label from the explanation (first noun phrase before period or comma)
                                                // e.g. "Anaphylaxis develops in minutes..." → bold "Anaphylaxis"
                                                // For the correct one, we use "Correct." (or matching label)
                                                let labelText, restText;
                                                // Strip common answer-key prefixes from any explanation
                                                const prefixRe = /^(Correct\.?|Incorrect\.?|Correct intervention\.?|Requires follow-up\.?)\s*/i;
                                                const prefixMatch = explanation.match(prefixRe);
                                                const cleaned = explanation.replace(prefixRe, "");
                                                if (isCorrect) {
                                                    labelText = prefixMatch ? prefixMatch[0].trim().replace(/\.$/, "") + "." : "Correct.";
                                                    restText = " " + cleaned;
                                                } else {
                                                    // Try to extract the first 1-3 words as the label (typically the wrong option's key concept)
                                                    if (prefixMatch && /follow-up/i.test(prefixMatch[0])) {
                                                        labelText = "Requires follow-up.";
                                                        restText = " " + cleaned;
                                                    } else {
                                                        // Match first phrase up to a verb-like break (first 1-3 words ending before a verb)
                                                        const m = cleaned.match(/^([A-Z][^\s]*(?:\s+[a-z][^\s]*){0,2})\s+(.*)/);
                                                        if (m) {
                                                            labelText = m[1];
                                                            restText = " " + m[2];
                                                        } else {
                                                            labelText = cleaned.split(/\s+/).slice(0, 2).join(" ");
                                                            restText = " " + cleaned.split(/\s+/).slice(2).join(" ");
                                                        }
                                                    }
                                                }

                                                return (
                                                    <div key={oi} className={`rat-card${isCorrect ? " is-correct" : ""}`}>
                                                        <div className={`rat-card-letter ${isCorrect ? "right" : "wrong"}`}>{letter}</div>
                                                        <div className="rat-card-text">
                                                            <span className={`lbl ${isCorrect ? "right-lbl" : "wrong-lbl"}`}>{labelText}</span>
                                                            {restText}
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════
        // CALCULATOR
        // ═══════════════════════════════════════════════════════
        function Calculator() {
            const [display, setDisplay] = useState("0");
            const [prev, setPrev] = useState(null);
            const [op, setOp] = useState(null);
            const [fresh, setFresh] = useState(false);
            const [hist, setHist] = useState([]);

            const press = v => {
                if (v === "C") { setDisplay("0"); setPrev(null); setOp(null); setFresh(false); return; }
                if (v === "±") { setDisplay(d => d.startsWith("-") ? d.slice(1) : "-" + d); return; }
                if (v === "%") { setDisplay(d => String(parseFloat(d) / 100)); return; }
                if (v === "⌫") { setDisplay(d => d.length > 1 ? d.slice(0, -1) : "0"); return; }
                if (["+", "-", "×", "÷"].includes(v)) { setPrev(parseFloat(display)); setOp(v); setFresh(true); return; }
                if (v === "=") {
                    if (prev === null || !op) return;
                    const cur = parseFloat(display);
                    let res;
                    if (op === "+") res = prev + cur; else if (op === "-") res = prev - cur;
                    else if (op === "×") res = prev * cur; else if (op === "÷") res = cur === 0 ? "Error" : prev / cur;
                    const rs = typeof res === "number" ? (Number.isInteger(res) ? String(res) : parseFloat(res.toFixed(8)).toString()) : res;
                    setHist(h => [`${prev} ${op} ${cur} = ${rs}`, ...h].slice(0, 4));
                    setDisplay(rs); setPrev(null); setOp(null); setFresh(true); return;
                }
                if (v === ".") {
                    if (fresh) { setDisplay("0."); setFresh(false); return; }
                    if (!display.includes(".")) setDisplay(d => d + ".");
                    return;
                }
                setDisplay(d => (fresh || d === "0") ? String(v) : d + v);
                setFresh(false);
            };

            const rows = [["C", "±", "%", "÷"], [7, 8, 9, "×"], [4, 5, 6, "-"], [1, 2, 3, "+"], [" ⌫", 0, ".", "="]];
            const isOp = v => ["+", "-", "×", "÷", "="].includes(v);
            const isFn = v => ["C", "±", "%", " ⌫"].includes(String(v));

            return (
                <div style={{ background: "white", borderRadius: 16, overflow: "hidden", boxShadow: "0 12px 40px rgba(0,0,0,.2)", width: 260, border: "1px solid #e2e8f0" }}>
                    <div style={{ background: "#f3f4f6", padding: "14px 16px 10px" }}>
                        {hist.slice(0, 2).map((h, i) => (
                            <div key={i} style={{ fontSize: 10, color: "rgba(255,255,255,.3)", fontFamily: "'DM Mono',monospace", lineHeight: 1.6 }}>{h}</div>
                        ))}
                        {op && <div style={{ fontSize: 11, color: "rgba(255,255,255,.45)", textAlign: "right", fontFamily: "'DM Mono',monospace" }}>{prev} {op}</div>}
                        <div style={{ fontSize: 28, fontWeight: 700, color: "white", textAlign: "right", fontFamily: "'DM Mono',monospace", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{display}</div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 1, background: "#e8ecf0" }}>
                        {rows.map((row, ri) => row.map((btn, ci) => (
                            <button key={`${ri}-${ci}`} onClick={() => press(btn)}
                                style={{
                                    padding: "14px 0", border: "none", cursor: "pointer",
                                    fontSize: btn === "=" ? 18 : 14, fontWeight: isOp(btn) ? 700 : 500,
                                    fontFamily: "'DM Mono',monospace",
                                    background: btn === "=" ? "#2C5F8D" : isOp(btn) ? "#dbeafe" : isFn(btn) ? "#f1f5f9" : "white",
                                    color: btn === "=" ? "white" : isOp(btn) ? "#2C5F8D" : isFn(btn) ? "#5a6474" : "#1a2332",
                                    transition: "all .1s"
                                }}
                                onMouseEnter={e => e.currentTarget.style.filter = "brightness(0.9)"}
                                onMouseLeave={e => e.currentTarget.style.filter = "brightness(1)"}>
                                {btn}
                            </button>
                        )))}
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════
