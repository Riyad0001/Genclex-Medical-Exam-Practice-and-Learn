services:
  web:
    build: .
    container_name: genclex_web
    restart: always
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    ports:
      - "8000:8000"
    networks:
      - genclex_net

  nginx:
    image: nginx:alpine
    container_name: genclex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - genclex_net

volumes:
  staticfiles:
  media:

networks:
  genclex_net:
    driver: bridge
